<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>

<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
body { margin:0; }
a { color:#cbd7f5; } a:hover { color:#fff; }
@keyframes cdraw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
@keyframes cstar { from { opacity:0; transform:scale(.3);} to { opacity:1; transform:scale(1);} }
@keyframes cfig { from { opacity:0; } to { opacity:var(--fo); } }
</style>
</helmet>
<div style="min-height:100vh;background:{{ pageBg }};font-family:'Cormorant Garamond',Georgia,serif;padding:64px 56px 96px;box-sizing:border-box;color:#e8ecfa">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:40px;flex-wrap:wrap;margin-bottom:56px;border-bottom:1px solid rgba(200,214,255,0.18);padding-bottom:24px">
    <div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.28em;text-transform:uppercase;color:rgba(200,214,255,0.55);margin-bottom:14px">Constellation + figure · 17</div>
      <h1 style="font-size:52px;font-weight:300;margin:0;letter-spacing:0.02em;line-height:1.1">별자리 · 삽화 정렬</h1>
    </div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.9;color:rgba(200,214,255,0.5);max-width:340px;text-align:right">
      선이 이어진 뒤 삽화가 떠오릅니다.<br>Tweaks에서 삽화 농도와 크기를 조절하세요.
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:40px 32px">
    <sc-for list="{{ items }}" as="c" hint-placeholder-count="17">
      <figure style="margin:0;background:{{ cardBg }};border:1px solid rgba(200,214,255,0.12);border-radius:4px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px">
        <div style="position:relative;width:100%;aspect-ratio:320/300">
        <img src="{{ c.href }}" alt="" style="position:absolute;left:{{ c.ix }};top:{{ c.iy }};width:{{ c.iw }};height:{{ c.ih }};object-fit:contain;transform:{{ c.itr }};--fo:{{ figOpacity }};opacity:{{ figOpacity }};animation:cfig 1.4s ease backwards;animation-delay:{{ c.figDelay }}" />
        <svg viewBox="0 0 320 300" style="position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible">
          <sc-for list="{{ c.lines }}" as="l" hint-placeholder-count="10">
            <line x1="{{ l.x1 }}" y1="{{ l.y1 }}" x2="{{ l.x2 }}" y2="{{ l.y2 }}" stroke="{{ lineColor }}" stroke-width="{{ lineWidth }}" vector-effect="non-scaling-stroke" stroke-linecap="round" style="--len:{{ l.len }}px;stroke-dasharray:{{ l.len }}px;stroke-dashoffset:0;animation:cdraw .8s cubic-bezier(.4,0,.2,1) backwards;animation-delay:{{ l.delay }}"></line>
          </sc-for>
          <sc-for list="{{ c.stars }}" as="s" hint-placeholder-count="10">
            <g style="animation:cstar .6s ease backwards;animation-delay:{{ s.delay }};opacity:1;transform-origin:{{ s.origin }}">
              <circle cx="{{ s.x }}" cy="{{ s.y }}" r="{{ s.halo }}" fill="{{ starColor }}" opacity="0.10"></circle>
              <circle cx="{{ s.x }}" cy="{{ s.y }}" r="{{ s.mid }}" fill="{{ starColor }}" opacity="0.28"></circle>
              <circle cx="{{ s.x }}" cy="{{ s.y }}" r="{{ s.r }}" fill="{{ starColor }}"></circle>
            </g>
          </sc-for>
        </svg>
        </div>
        <figcaption style="display:flex;flex-direction:column;align-items:flex-start;gap:5px;border-top:1px solid rgba(200,214,255,0.10);padding-top:10px">
          <span style="font-size:22px;font-weight:400;letter-spacing:0.02em;white-space:nowrap">{{ c.ko }}</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(200,214,255,0.45)">{{ c.la }} · {{ c.count }}</span>
        </figcaption>
      </figure>
    </sc-for>
  </div>
</div>

const D = Math.PI / 180;
function vec([ra, dec]) {
  const r = ra * 15 * D, d = dec * D;
  return [Math.cos(d) * Math.cos(r), Math.cos(d) * Math.sin(r), Math.sin(d)];
}
function norm(v) { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/m, v[1]/m, v[2]/m]; }
function dot(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
function cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }

function project(entry, W, H, pad, scale, figScale) {
  const keys = Object.keys(entry.stars);
  const vs = keys.map(k => vec(entry.stars[k]));
  const c = norm(vs.reduce((a, v) => [a[0]+v[0], a[1]+v[1], a[2]+v[2]], [0,0,0]));
  let east = cross([0,0,1], c);
  if (Math.hypot(east[0], east[1], east[2]) < 1e-6) east = [1,0,0];
  east = norm(east);
  const north = cross(c, east);
  const raw = {};
  keys.forEach((k, i) => {
    const v = vs[i], f = 2 / (1 + dot(v, c));
    raw[k] = [-f * dot(v, east), -f * dot(v, north)];
  });
  const xs = keys.map(k => raw[k][0]), ys = keys.map(k => raw[k][1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const s = Math.min((W - pad*2) / Math.max(maxX-minX, 1e-6), (H - pad*2) / Math.max(maxY-minY, 1e-6));
  const ox = (W - (maxX-minX)*s) / 2 - minX*s;
  const oy = (H - (maxY-minY)*s) / 2 - minY*s;
  const pts = {};
  keys.forEach(k => { pts[k] = [raw[k][0]*s + ox, raw[k][1]*s + oy]; });

  const px = keys.map(k => pts[k][0]), py = keys.map(k => pts[k][1]);
  const bx0 = Math.min(...px), bx1 = Math.max(...px);
  const by0 = Math.min(...py), by1 = Math.max(...py);
  const box = Math.min(Math.max(bx1-bx0, by1-by0) * (entry.adj.s * figScale), Math.min(W, H) - 6);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const cx = (bx0+bx1)/2 + (entry.adj.dx || 0), cy = (by0+by1)/2 + (entry.adj.dy || 0);
  const bxL = clamp(cx - box/2, 3, W - box - 3), byT = clamp(cy - box/2, 3, H - box - 3);

  const stars = keys.map((k, i) => {
    const mag = entry.stars[k][2];
    const r = Math.max(1.1, (4.8 - 0.62 * mag)) * scale;
    return { key: k, x: +pts[k][0].toFixed(2), y: +pts[k][1].toFixed(2),
      r: +r.toFixed(2), mid: +(r*2.1).toFixed(2), halo: +(r*4.4).toFixed(2),
      origin: pts[k][0].toFixed(1) + "px " + pts[k][1].toFixed(1) + "px",
      delay: (0.05 * i).toFixed(2) + "s" };
  });
  const lines = entry.lines.map((L, i) => {
    const a = pts[L[0]], b = pts[L[1]];
    return {
      x1: +a[0].toFixed(2), y1: +a[1].toFixed(2),
      x2: +b[0].toFixed(2), y2: +b[1].toFixed(2),
      len: Math.hypot(b[0]-a[0], b[1]-a[1]).toFixed(2),
      delay: (0.35 + 0.09 * i).toFixed(2) + "s"
    };
  });
  return {
    stars, lines, count: keys.length + " stars",
    ix: (100*bxL/W).toFixed(2) + "%", iy: (100*byT/H).toFixed(2) + "%",
    iw: (100*box/W).toFixed(2) + "%", ih: (100*box/H).toFixed(2) + "%",
    itr: entry.adj.flip ? "scaleX(-1)" : "none",
    figDelay: (0.35 + 0.09 * entry.lines.length + 0.2).toFixed(2) + "s"
  };
}

class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const transparent = p.transparentBackground ?? false;
    const scale = p.starScale ?? 1;
    const figScale = p.figureScale ?? 0.75;
    const items = DATA.map(e => Object.assign(
      { ko: e.ko, la: e.la, href: "figures-lit/" + e.slug + ".png" },
      project(e, 320, 300, 34, scale, figScale)
    ));
    return {
      items,
      pageBg: transparent ? "transparent" : "#0b1024",
      cardBg: transparent ? "transparent" : "rgba(255,255,255,0.02)",
      lineColor: p.lineColor ?? "rgba(206,220,255,0.9)",
      lineWidth: p.lineWidth ?? 1.2,
      starColor: p.starColor ?? "#f4f1e4",
      figOpacity: p.figureOpacity ?? 0.55
    };
  }
}

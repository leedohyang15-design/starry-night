#app,#mapScr{max-width:1100px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:10px 14px}
header{display:flex;align-items:center;gap:12px;padding-bottom:6px;flex-wrap:wrap}
header h1{font-size:18px;letter-spacing:2px;color:#ffd76a}
header .sub{font-size:12px;color:#9aa4c0}
#relicRow{display:flex;gap:5px}
.relic{font-size:12.5px;background:#1d2742;border:1px solid #6b5a2e;color:#ffe9b0;border-radius:4px;padding:1px 6px;cursor:default}
#dustTag{margin-left:auto;font-size:13px;color:#ffe9b0}
#stageTag{font-size:13px;color:#8fd3ff}

/* ── 맵 ── */
#mapWrap{flex:1;overflow-y:auto;border:1px solid #26325a;border-radius:10px;background:radial-gradient(ellipse at 50% 120%, #141d3d 0%, #0a0f22 70%);position:relative}
#mapInner{position:relative;width:640px;margin:0 auto}
#mapSvg{position:absolute;inset:0;width:100%;height:100%}
.mapnode{position:absolute;width:84px;height:52px;transform:translate(-50%,-50%);border-radius:9px;border:1.5px solid #3a4670;background:#141d3d;color:#aab4d4;font-size:11.5px;text-align:center;cursor:default;line-height:1.3;padding-top:8px}
.mapnode b{display:block;font-size:13px}
.mapnode.avail{border-color:#ffd76a;color:#ffe9b0;cursor:pointer;box-shadow:0 0 12px rgba(255,215,106,.4)}
.mapnode.avail:hover{background:#26325a}
.mapnode.here{border-color:#8fd3ff;color:#8fd3ff;box-shadow:0 0 12px rgba(140,210,255,.5)}
.mapnode.past{opacity:.35}
.mapnode.elite{border-style:double;border-width:3.5px}
#mapHint{font-size:12px;color:#9aa4c0;text-align:center;padding:6px}

/* ── 적 구역 ── */
#enemyZone{display:flex;align-items:center;gap:18px;justify-content:center;padding:6px 0}
#enemySprite{width:88px;height:88px;border-radius:50%;flex:none;box-shadow:0 0 28px rgba(255,120,90,.35)}
.sp-mars{background:radial-gradient(circle at 35% 30%, #ff9a6b, #b33a1f 65%, #6e1d0e)}
.sp-shard{background:radial-gradient(circle at 35% 30%, #d8dce8, #7a8298 60%, #3a4152);border-radius:22%}
.sp-comet{background:radial-gradient(circle at 30% 30%, #eafcff, #7fd8e8 45%, #1c5a7a)}
.sp-moonlet{background:radial-gradient(circle at 35% 30%, #e8e2d2, #a89c7c 60%, #5a5040)}
.sp-titan{background:radial-gradient(circle at 35% 30%, #ffe2a8, #c8963e 60%, #6e4a14)}
.sp-rogue{background:radial-gradient(circle at 35% 30%, #b8c4ff, #4a5ab3 60%, #1c2260)}
.sp-pleiades{background:radial-gradient(circle at 30% 30%, #dff1ff, #6fa8ff 40%, #1c3a7a 75%);box-shadow:0 0 34px rgba(140,190,255,.55)}
.sp-hyades{background:radial-gradient(circle at 30% 30%, #ffe8d0, #e8a86f 45%, #7a4a1c 80%);box-shadow:0 0 30px rgba(230,170,110,.5)}
.sp-m1{background:radial-gradient(circle at 40% 40%, #d0fff2, #6fe8c8 40%, #1c7a5f 80%);box-shadow:0 0 34px rgba(110,230,200,.5)}
.sp-m42{background:radial-gradient(circle at 40% 45%, #ffd7f0, #b76bff 45%, #3a1c6e 80%);box-shadow:0 0 40px rgba(200,120,255,.6)}
#enemyInfo{min-width:300px}
#enemyName{font-size:16px;font-weight:700}
#enemyAbility{font-size:11.5px;color:#e8a86f}
#enemyIntent{font-size:13px;color:#ffb56b;margin:3px 0}
.hpbar{width:300px;height:14px;background:#222b45;border-radius:7px;overflow:hidden;border:1px solid #38436b}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff5f6d,#ff9a6b);transition:width .25s}
.stat{font-size:12px;color:#c7ccd6;margin-top:3px}
.chips{margin-top:4px;font-size:11.5px;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#1d2742;border:1px solid #3a4670;border-radius:4px;padding:1px 6px}
.chip.bad{border-color:#8a4a4a;color:#ffb0a6}
.chip.good{border-color:#4a8a5c;color:#a6ffc0}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ── 밤하늘 ── */
#sky{position:relative;flex:1;min-height:130px;border:1px solid #26325a;border-radius:10px;background:radial-gradient(ellipse at 50% 120%, #141d3d 0%, #0a0f22 70%);overflow:hidden}
#skysvg{position:absolute;inset:0;width:100%;height:100%}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:26px;font-weight:800;color:#ffd76a;text-shadow:0 0 18px rgba(255,215,106,.8);opacity:0;pointer-events:none;transition:opacity .3s;text-align:center}
#banner small{display:block;font-size:13px;color:#ffe9b0;font-weight:400;margin-top:2px}
#banner.show{opacity:1}
#log{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:#9aa4c0;line-height:1.5;pointer-events:none;max-width:64%}
#log .l0{color:#dfe6ff}

/* ── 트래커 ── */
#tracker{display:flex;gap:9px;flex-wrap:wrap;padding:7px 2px;font-size:13.5px}
.trk{border:1px solid #2c3760;border-radius:6px;padding:5px 10px;color:#aab4d4;background:#121a33}
.trk b{color:#e8ecf7}
.trk.ready{border-color:#7ee08a;color:#a6ffc0;box-shadow:0 0 8px rgba(120,255,150,.25)}
.trk.done{border-color:#ffd76a;color:#ffd76a}
.trk.sealed{border-color:#8a4a4a;color:#ffb0a6}

/* ── 플레이어 줄 ── */
#playerBar{display:flex;align-items:center;gap:12px;padding:6px 0;flex-wrap:wrap}
#manaOrb{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #9fd8ff, #2f6fd0 60%, #16336e);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;box-shadow:0 0 16px rgba(90,160,255,.5);flex:none}
#pstats{font-size:13px;line-height:1.55}
#pchips{display:flex;gap:6px;font-size:11.5px}
#skillRow,#itemRow{display:flex;gap:6px}
#skillRow{margin-left:auto}
.skillbtn,.itembtn{background:#18213e;border:1px solid #3a4670;color:#dfe6ff;border-radius:7px;padding:6px 9px;font-size:11.5px;cursor:pointer;text-align:left;line-height:1.35}
.skillbtn b{display:block;font-size:12px;color:#8fd3ff}
.itembtn{border-color:#5a8a4a;color:#c8f0b8}
.skillbtn.off,.itembtn.off{opacity:.35;cursor:default}
#endTurn{background:#ffd76a;color:#221a04;border:0;border-radius:8px;font-size:13.5px;font-weight:800;padding:10px 14px;cursor:pointer;flex:none}
#piles{font-size:12px;color:#9aa4c0;text-align:right;line-height:1.5;flex:none}

/* ── 카드 ── */
#hand{display:flex;gap:8px;justify-content:center;align-items:flex-end;min-height:196px;padding-bottom:4px}
.card{width:136px;height:190px;background:linear-gradient(180deg,#1a2340,#111831);border:1.5px solid var(--gc,#556);border-radius:9px;padding:7px 8px;cursor:pointer;position:relative;transition:transform .12s;display:flex;flex-direction:column;flex:none}
#hand .card:hover{transform:translateY(-26px) scale(1.24);z-index:5}
.card.unplayable{filter:grayscale(.7) brightness(.6);cursor:default}
.card.sealedcard{filter:grayscale(1) brightness(.45);cursor:default;outline:2px dashed #8a4a4a}
.card.willfinish{box-shadow:0 0 14px rgba(255,215,106,.75);border-color:#ffd76a}
.card.upframe{border-color:#9fc8e8;box-shadow:0 0 8px rgba(160,200,230,.35)}
.card.mergeframe{border-color:#b06fe8;box-shadow:0 0 8px rgba(176,111,232,.4)}
.cchip{position:absolute;top:-8px;right:-6px;font-size:10px;font-weight:800;border-radius:4px;padding:1px 5px}
.cchip.up{background:#9fc8e8;color:#0e1a26}
.cchip.merge{background:#b06fe8;color:#1c0e26}
.cname{font-size:11px;font-weight:700;color:var(--gc);line-height:1.25;min-height:28px;padding-left:14px}
.cname small{color:#c7ccd6;font-weight:400}
.ccost{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #9fd8ff, #2f6fd0 70%);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff}
.ctype{font-size:10px;color:#9aa4c0;margin:2px 0}
.cfx{flex:1;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#e8ecf7;overflow:hidden}
.cfx span{display:block;text-align:center;line-height:1.4}
.cfx b{color:#ffd76a}
.ccon{font-size:10px;color:#8fd3ff;text-align:center;border-top:1px dashed #2c3760;padding-top:3px}
.clore{display:none;font-size:9.5px;color:#9aa4c0;line-height:1.3;padding-top:3px;font-style:italic}
#hand .card:hover .clore{display:block}
.num{position:absolute;font-size:25px;font-weight:800;pointer-events:none;animation:rise 1s forwards}
@keyframes rise{to{transform:translateY(-46px);opacity:0}}

/* ── 오버레이 ── */
.ovl{position:fixed;inset:0;background:rgba(5,8,18,.88);display:none;align-items:center;justify-content:center;z-index:20}
.ovl.show{display:flex}
.panel{background:#121a33;border:1px solid #34406b;border-radius:12px;padding:24px 28px;max-width:860px;max-height:92vh;overflow:auto;text-align:center}
.panel h2{color:#ffd76a;font-size:19px;margin-bottom:6px}
.panel p{font-size:13px;color:#aab4d4;margin-bottom:14px}
.optRow{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.conOpt{width:190px;border:1.5px solid #3a4670;border-radius:9px;padding:12px;cursor:pointer;background:#18213e}
.conOpt:hover{border-color:#ffd76a}
.conOpt b{font-size:15px}
.conOpt .idn{color:#8fd3ff;font-size:12px;margin:4px 0}
.conOpt .own{color:#9aa4c0;font-size:11.5px;line-height:1.4}
.card.pick{cursor:pointer}
.card.picked{outline:2.5px solid #7ee08a;box-shadow:0 0 12px rgba(120,255,150,.5)}
.card.pick:hover{transform:scale(1.06)}
.btn{background:#ffd76a;color:#221a04;border:0;border-radius:7px;font-size:14px;font-weight:700;padding:10px 20px;cursor:pointer;margin:4px 5px}
.btn.ghost{background:transparent;color:#9aa4c0;border:1px solid #3a4670}
.btn:disabled{opacity:.4;cursor:default}
#kwHelp{font-size:10.5px;color:#767f9c;text-align:center;padding-bottom:4px}

/* ═══ v0.5 픽셀 테마 — 직각 모서리 · 하드 섀도 · 도트 렌더 ═══ */
*{border-radius:0!important}
svg.px,img.px{image-rendering:pixelated}
.card,.conOpt,.panel,.btn,.skillbtn,.itembtn,#endTurn,.mapnode,.trk,.relic,.chip{box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.card.willfinish{box-shadow:2px 2px 0 rgba(0,0,0,.5),0 0 14px rgba(255,215,106,.75)}
.card.upframe{box-shadow:2px 2px 0 rgba(0,0,0,.5),0 0 8px rgba(160,200,230,.35)}
.card.mergeframe{box-shadow:2px 2px 0 rgba(0,0,0,.5),0 0 8px rgba(176,111,232,.4)}
#manaOrb{box-shadow:2px 2px 0 rgba(0,0,0,.5),0 0 16px rgba(90,160,255,.5)}
.mapnode.avail{box-shadow:2px 2px 0 rgba(0,0,0,.5),0 0 12px rgba(255,215,106,.4)}
.mapnode.here{box-shadow:2px 2px 0 rgba(0,0,0,.5),0 0 12px rgba(140,210,255,.5)}
.mapnode{padding-top:5px;height:58px}
.mapnode svg{display:block;margin:0 auto 1px}
.sprwrap{display:flex;align-items:flex-end;justify-content:center;flex:none}
.minichart{position:absolute;left:10px;right:10px;top:62px;height:58px;opacity:.15;pointer-events:none}
.minichart svg{width:100%;height:100%}
.pface{vertical-align:-5px;margin-right:2px}
#app.flash{animation:goldflash .7s}
@keyframes goldflash{0%{filter:brightness(1)}20%{filter:brightness(1.7) saturate(1.5)}100%{filter:brightness(1)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.7}}

/* ═══ v0.10 관측소 전장 — 별자리 보드 중심 · 얇은 테두리 · 절제된 금 ═══ */
#app{position:relative;max-width:none;padding:6px 16px 8px;
 background-image:
  radial-gradient(1.6px 1.6px at 23px 31px, rgba(210,225,255,.55) 50%, transparent 52%),
  radial-gradient(1.2px 1.2px at 97px 143px, rgba(160,190,255,.42) 50%, transparent 52%),
  radial-gradient(1.2px 1.2px at 156px 68px, rgba(255,240,200,.30) 50%, transparent 52%),
  radial-gradient(1px 1px at 51px 105px, rgba(190,205,245,.25) 50%, transparent 52%);
 background-size:219px 191px, 263px 233px, 317px 301px, 173px 157px}
#topbar{display:flex;align-items:flex-start;gap:12px;padding:2px 0 4px}
#invRow{display:flex;flex-direction:column;gap:4px;max-width:30%}
#invRow #itemRow{flex-wrap:wrap}
#titleMini{flex:1;text-align:center;font-size:14.5px;color:#ffd76a;letter-spacing:1px;padding-top:4px;opacity:.85}
#titleMini .sub{color:#9aa4c0;font-size:12px}
#titleMini #stageTag{color:#8fd3ff;font-size:13px}
#titleMini #turnTag{color:#c7ccd6;font-size:13px}
#sysRow{display:flex;gap:6px;align-items:center}
.sysbtn{background:#111a33;border:1px solid #2c3760;color:#c7d0e8;font-size:13.5px;padding:8px 13px;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.sysbtn:disabled{opacity:.35;cursor:default}
#logPanel{position:absolute;top:50px;right:14px;width:390px;max-height:330px;overflow-y:auto;z-index:40;display:none;
 background:rgba(9,13,26,.97);border:1px solid #26325a;padding:10px 12px;box-shadow:3px 3px 0 rgba(0,0,0,.55)}
#logPanel.show{display:block}
#logPanel .lphead{font-size:10px;color:#767f9c;letter-spacing:3px;border-bottom:1px solid #1c2547;padding-bottom:5px;margin-bottom:6px}
#logPanel #log div{font-size:13px;line-height:1.75;color:#9aa4c0}
#logPanel #log .l0{color:#dfe6ff}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:56%;text-align:center;
 font-size:13.5px;color:#dfe6ff;pointer-events:none;opacity:0;transition:opacity .5s;z-index:8;
 background:rgba(9,13,26,.9);border:1px solid #26325a;padding:5px 15px;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
#toast.show{opacity:1}
#toast b{color:#ffe9b0}

#field{position:relative;flex:1;min-height:0}
#sky{position:absolute;left:12px;top:calc(50% - 16px);transform:translateY(-50%);width:440px;height:440px;
 border:0;border-radius:50%!important;overflow:visible;
 background:radial-gradient(circle at 50% 60%, #16224a 0%, #0e1734 55%, #090e20 100%);
 box-shadow:0 0 46px 8px rgba(80,110,200,.26), inset 0 0 48px rgba(5,8,18,.9)}
#skysvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
@keyframes skyglow{0%,100%{box-shadow:0 0 46px 8px rgba(80,110,200,.26), inset 0 0 48px rgba(5,8,18,.9)}
 40%{box-shadow:0 0 70px 20px rgba(255,215,106,.30), inset 0 0 48px rgba(5,8,18,.9)}}
#sky.glowpulse{animation:skyglow 1.4s ease}
#turnBanner{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);z-index:6;
 font-size:31px;font-weight:800;color:#dfe6ff;letter-spacing:7px;text-align:center;
 text-shadow:0 0 20px rgba(120,150,255,.75);opacity:0;pointer-events:none}
#turnBanner small{display:block;font-size:14px;letter-spacing:3px;color:#8fa3d8;margin-top:4px;font-weight:400}
@keyframes tbanim{0%{opacity:0;transform:translate(-50%,-50%) scale(.72)}16%{opacity:1;transform:translate(-50%,-50%) scale(1)}
 74%{opacity:1}100%{opacity:0;transform:translate(-50%,-52%) scale(1.02)}}
#turnBanner.show{animation:tbanim .95s ease forwards}
.cardghost{position:fixed;width:66px;height:98px;z-index:145;pointer-events:none;
 background:linear-gradient(160deg,#1e2a52,#0d1428);border:2px solid #4a5a8a;
 clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);
 transition:left .55s cubic-bezier(.55,0,.85,.45),top .55s cubic-bezier(.55,0,.85,.45),transform .55s,opacity .55s}
.cardghost::after{content:'✦';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#5a6a9a;font-size:20px}
.cardghost.gain{border-color:#7ee08a;box-shadow:0 0 14px rgba(126,224,138,.5)}
.cardghost.gain::after{color:#7ee08a}
.fxfloat{position:fixed;font-size:18px;font-weight:800;z-index:146;pointer-events:none;animation:rise 1.05s forwards;text-shadow:1px 1px 0 rgba(0,0,0,.85)}
.slashfx{position:fixed;width:96px;height:96px;z-index:144;pointer-events:none;
 background:linear-gradient(45deg,transparent 45%,#fff 49%,#ffd76a 51%,transparent 55%);
 animation:slashan .3s ease-out forwards}
@keyframes slashan{0%{transform:scale(.35) rotate(-24deg);opacity:0}30%{opacity:1}100%{transform:scale(1.3) rotate(12deg);opacity:0}}
@keyframes hitfl{35%{filter:brightness(2.2) saturate(1.7)}}
#enemySprite.hitflash{animation:hitfl .18s}
@keyframes dealIn{from{transform:translate(-52vw,30vh) rotate(-35deg) scale(.35);opacity:0}
 to{transform:translateX(-50%) rotate(var(--rot,0deg));opacity:1}}
#hand .card.dealt{animation-name:dealIn;animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.75,.3,1);animation-fill-mode:backwards}
#field #banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:74%;font-size:30px;z-index:4}
#playerInfo{position:absolute;left:16px;bottom:2px;width:340px;display:flex;flex-direction:column;gap:5px;pointer-events:none;z-index:2}
#playerInfo #hpWrap{width:300px}
#hpWrap{position:relative;height:26px;background:#1a2136;border:1px solid #38436b;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
#hpWrap i{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#c8383f,#ff7a5a);transition:width .25s}
#hpWrap span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;text-shadow:1px 1px 0 rgba(0,0,0,.7)}
#enemyArea{position:absolute;right:11%;bottom:56px;width:280px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#enemyName{font-size:17.5px;font-weight:700;text-shadow:1px 1px 0 rgba(0,0,0,.85)}
#enemyAbility{font-size:11px;color:#e8a86f;text-align:center;line-height:1.45;max-width:270px;text-shadow:1px 1px 0 rgba(0,0,0,.85)}
#enemyWrap{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:160px;margin-top:3px}
#enemyShadow{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:172px;height:30px;
 background:radial-gradient(ellipse at center, rgba(0,0,0,.5) 0%, transparent 68%)}
#enemyArea #enemySprite{position:relative;width:auto;height:auto;box-shadow:none;background:none;display:flex;align-items:flex-end;justify-content:center}
#enemyArea .hpbar{width:214px;height:19px;position:relative;background:#1a2136;border:1px solid #38436b;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
#enemyArea .hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.8)}
#intentPlate{margin-top:4px;min-width:180px;border:1px solid #3a4670;background:rgba(12,18,38,.78);
 padding:5px 16px 6px;text-align:center;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
#intentPlate .ilabel{font-size:10.5px;color:#767f9c;letter-spacing:3px;margin-bottom:1px}
#enemyIntent{font-size:19px;font-weight:800;color:#ffb56b;text-shadow:1px 1px 0 rgba(0,0,0,.7)}
#endTurn{position:absolute;right:0;bottom:6px;z-index:5;background:#141d3d;color:#ffd76a;border:1px solid #8a7a3e;
 font-size:15.5px;font-weight:800;padding:13px 19px;cursor:pointer;line-height:1.3;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
#endTurn:hover{background:#1c2750}
#endTurn small{font-weight:400;font-size:11px;color:#c8b06a}
.starfly{position:fixed;width:11px;height:11px;z-index:150;pointer-events:none;
 background:radial-gradient(circle,#fff 0%,#ffd76a 55%,transparent 75%);box-shadow:0 0 9px rgba(255,215,106,.9);
 transition:left .36s ease-in,top .36s ease-in,opacity .36s}

#bottomBar{position:relative;display:flex;align-items:flex-end;gap:8px;padding:0 0 6px}
#allyBtnWrap{position:absolute;left:calc(50% + 418px);bottom:100px;z-index:30}
#lhud{flex:none;padding-bottom:4px;display:flex;flex-direction:column;gap:8px}

/* 조력자 = 하스스톤식 원형 영능 버튼 */
.allyorb{position:relative;width:92px;height:92px;border-radius:50%!important;cursor:pointer;flex:none;
 border:2px solid #8a7a3e;background:radial-gradient(circle at 42% 30%, #1c2750, #0d1428 72%);
 display:flex;align-items:flex-start;justify-content:center;overflow:visible;
 box-shadow:2px 2px 0 rgba(0,0,0,.5), inset 0 0 14px rgba(6,9,20,.8)}
.aofaces{width:84px;height:84px;border-radius:50%!important;overflow:hidden;display:flex;justify-content:center;margin-top:1px}
.aofaces img{height:126px!important;flex:none}
.aofaces img+img{margin-left:-27px}
@keyframes allyglow{0%,100%{box-shadow:2px 2px 0 rgba(0,0,0,.5), inset 0 0 14px rgba(6,9,20,.8)}
 50%{box-shadow:2px 2px 0 rgba(0,0,0,.5), inset 0 0 14px rgba(6,9,20,.8), 0 0 18px rgba(255,215,106,.5)}}
.allyorb.glow{animation:allyglow 2.4s ease-in-out infinite}
.allyorb.off{filter:grayscale(.9) brightness(.6);cursor:default;animation:none;border-color:#3a4462}
.allyorb .aotip{display:none;position:absolute;bottom:100px;right:-4px;width:260px;z-index:60;text-align:left;
 background:rgba(9,13,26,.97);border:1px solid #3a4670;padding:8px 10px;box-shadow:3px 3px 0 rgba(0,0,0,.55);pointer-events:none}
.allyorb:hover .aotip{display:block}

/* 상태 효과 타일 */
.stile{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:4px 9px;background:#111a33;
 border:1px solid #3a4670;box-shadow:2px 2px 0 rgba(0,0,0,.5);cursor:default}
.stile i{font-style:normal;font-size:14px}
.stile b{font-size:14px}
.stile.good{border-color:#3e6e50;color:#a6ffc0}
.stile.bad{border-color:#8a4a4a;color:#ffb0a6}
/* 플레이어 줄 — 성막 배지·가루 */
#pRow{display:flex;align-items:center;gap:7px}
#blockBadge{display:none;align-items:center;gap:5px;font-size:21px;font-weight:800;color:#cfe8ff;
 background:linear-gradient(180deg,#1c3866,#122344);border:2px solid #4e8ec8;padding:7px 13px;
 box-shadow:2px 2px 0 rgba(0,0,0,.5),0 0 12px rgba(90,160,255,.35);text-shadow:0 0 8px rgba(140,200,255,.7)}
#blockBadge b{font-size:22px}
@keyframes blockpop{from{transform:scale(1.45)}to{transform:scale(1)}}
#blockBadge.pop{animation:blockpop .3s ease-out}
#dustHud{font-size:14px;color:#ffe9b0;background:#111a33;border:1px solid #6b5a2e;padding:4px 8px;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
/* 덱 뭉치·블랙홀 더미 */
.pilebtn{position:relative;width:66px;height:66px;cursor:pointer;flex:none}
.pilebtn svg{width:100%;height:100%}
.pilebtn b{position:absolute;right:-6px;bottom:-4px;font-size:13.5px;background:#111a33;border:1px solid #3a4670;
 padding:1px 6px;color:#e8ecf7;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.pilebtn:hover{filter:brightness(1.3)}
/* 성좌 완성 중앙 연출 */
@keyframes fadeto{to{opacity:var(--fo,1)}}
@keyframes segdraw{to{stroke-dashoffset:0}}
@keyframes starpop{from{transform:scale(2.1)}to{transform:scale(1)}}
@keyframes halopulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.8);opacity:.45}}
#skysvg circle,#conFx circle{transform-box:fill-box;transform-origin:center}
#conFx{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:390px;text-align:center;
 opacity:0;transition:opacity .35s;pointer-events:none;z-index:5}
#conFx.show{opacity:1}
#conFx svg{width:300px;height:300px;filter:drop-shadow(0 0 14px rgba(120,150,255,.25))}
#conFx .cfname{font-size:27px;font-weight:800;color:#ffd76a;text-shadow:0 0 16px rgba(255,215,106,.8);margin-top:-8px}
#conFx .cfsub{font-size:14px;color:#ffe9b0;margin-top:3px;text-shadow:1px 1px 0 rgba(0,0,0,.8)}
/* 키워드 툴팁 */
#allyBubble{position:fixed;max-width:268px;background:#fff;color:#14181f;font-size:14px;line-height:1.55;
 padding:9px 13px;z-index:142;display:none;box-shadow:3px 3px 0 rgba(0,0,0,.5);pointer-events:none}
#allyBubble.show{display:block}
#allyBubble b{color:#26325a;margin-right:2px}
#allyBubble::after{content:'';position:absolute;bottom:-9px;right:30px;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
#kwTip{position:fixed;width:252px;z-index:130;display:none;background:rgba(9,13,26,.97);
 border:1px solid #3a4670;padding:9px 11px;box-shadow:3px 3px 0 rgba(0,0,0,.55)}
#kwTip.show{display:block}
#kwTip div{font-size:11px;line-height:1.55;color:#c7d0e8;margin:2px 0}
#kwTip b{color:#7ee0c8}
#hand{position:relative;flex:1;height:280px;min-height:280px}
#hand .card{position:absolute;left:calc(50% + var(--tx,0px));bottom:calc(4px - var(--ty,0px));
 transform:translateX(-50%) rotate(var(--rot,0deg));transition:transform .14s,bottom .14s;touch-action:none}
#hand .card:hover{transform:translateX(-50%) rotate(0deg) translateY(-52px) scale(1.2);z-index:60!important}
.card.dragcard{position:fixed!important;bottom:auto!important;margin:0;z-index:120!important;
 transform:rotate(0deg) scale(1.06)!important;pointer-events:none;box-shadow:0 14px 30px rgba(0,0,0,.6)}
@keyframes cardshake{25%{margin-left:-7px}75%{margin-left:7px}}
.card.noplay{animation:cardshake .28s}

/* 트래커 = 별 도트 진행 */
.tdt{color:#3a4670;font-size:11.5px}
.tdt.on{color:#ffe9b0;text-shadow:0 0 6px rgba(255,215,106,.55)}
.tln{color:#232d52;font-size:11.5px;margin:0 -1px}
.tln.on{color:#c8b06a}
.trk.trkhot{border-color:#ffd76a;box-shadow:2px 2px 0 rgba(0,0,0,.5),0 0 9px rgba(255,215,106,.35)}

@media(max-height:860px){#sky{width:400px;height:400px}}

 #intentPlate .ilabel{font-size:9px}#endTurn{bottom:2px;font-size:13.5px;padding:10px 14px}}
@media(max-width:1150px){#sky{width:330px;height:330px}#enemyArea{right:6%}#allyBtnWrap{left:auto;right:8px;bottom:150px}}

/* ═══ v0.10 카드 — ORION 틀 + 등급색 프레임 (α금·β보라·γ하늘·δ초록·ε은회) ═══ */
.card{width:168px;height:258px;padding:0;background:linear-gradient(180deg,#141b30,#0e1426);border:1.5px solid var(--gc,#6b5a2e);display:flex;flex-direction:column;overflow:hidden}
.card.canplay:not(.willfinish){box-shadow:2px 2px 0 rgba(0,0,0,.5),0 0 9px rgba(150,190,255,.22)}
.card.g1{box-shadow:2px 2px 0 rgba(0,0,0,.5),0 0 13px rgba(255,215,106,.4)}
.cd-head{display:flex;align-items:center;gap:5px;padding:5px 7px 4px;border-bottom:1px solid var(--gc,#3a3320);background:#101728}
.cd-cost{width:23px;height:23px;flex:none;border-radius:50%!important;border:1.5px solid var(--gc,#c8a04a);background:#1a2340;color:var(--gc,#ffd76a);font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cd-title{flex:1;font-size:11px;font-weight:700;color:#e8d5a0;line-height:1.15}
.cd-title small{color:#9aa4c0;font-weight:400;font-size:9.5px}
.cd-grade{font-size:9.5px;color:var(--gc,#c8a04a);font-style:italic;flex:none}
.cd-panel{position:relative;height:80px;flex:none;background:linear-gradient(180deg,#0c1a3d 0%,#0a1330 60%,#0a0f22 100%);border-bottom:1px solid #3a3320}
.cd-panel svg{position:absolute;inset:0;width:100%;height:100%}
.cd-emblem{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);width:24px;height:24px;border:1.5px solid var(--gc,#c8a04a);background:#0e1426;color:var(--gc,#ffd76a);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2}
.cd-fx1{flex:1;padding:14px 7px 4px;font-size:9.8px;line-height:1.45;color:#cfe0f4;display:flex;align-items:center;overflow:hidden}
.cd-fx1 b{color:#ffd76a}
.cd-fx1>span{width:100%;text-align:center}
.cd-fx2{border-top:1px dashed #2c3760;background:#0e1630;padding:5px 7px;font-size:9.2px;line-height:1.45;color:#cdc39e;
 min-height:37px;display:flex;align-items:center;justify-content:center;text-align:center}
.cd-fx2 b{color:#ffd76a}
.cd-fx2 .gstar{color:var(--gc,#8fd3ff);margin-right:2px}
.cd-cost.disc{border-color:#7ee08a;color:#7ee08a}
.cd-fx2 .dim{color:#767f9c}
.cd-fx3{border-top:1px solid #1c2547;padding:4px 7px 5px;font-size:8.6px;line-height:1.4;color:#767f9c;font-style:italic;text-align:center;min-height:20px}
.kw{color:#7ee0c8;font-weight:700}
.card .cchip{top:26px;right:-5px}

/* ═══ v0.13 상점 — 별장수의 좌판 ═══ */
#shopHead{display:flex;align-items:center;gap:16px;margin-bottom:10px;text-align:left}
#merchWrap{flex:none;filter:drop-shadow(0 0 10px rgba(255,215,106,.25))}
@keyframes mbounce{30%{transform:translateY(-7px) rotate(-3deg)}60%{transform:translateY(2px)}}
#merchWrap.mbounce{animation:mbounce .5s ease}
#merchCol{flex:1}
#merchSay{font-size:14px;color:#ffe9b0;font-style:italic;line-height:1.5;min-height:22px}
#shopDust{flex:none;font-size:17px;color:#ffe9b0;background:#111a33;border:1px solid #6b5a2e;padding:9px 14px;text-align:center}
.shopSec{font-size:11px;color:#767f9c;letter-spacing:4px;text-align:left;border-bottom:1px solid #1c2547;padding-bottom:4px;margin:12px 0 10px}
.pricetag{font-size:13px;color:#ffe9b0;background:#171205;border:1px solid #6b5a2e;padding:3px 11px}

.conOpt.soldout{opacity:.35;cursor:default;display:flex;flex-direction:column;justify-content:center;min-height:120px}

.evtitle{font-size:21px;font-weight:800;color:#ffd76a;margin:14px 0 8px;letter-spacing:2px;text-shadow:0 0 14px rgba(255,215,106,.4)}
.evdesc{font-size:14px;color:#c7d0e8;line-height:1.8;max-width:560px;margin:0 auto 16px;text-align:center}
.evchoices{display:flex;flex-direction:column;gap:9px;align-items:center}

.btn.evrisk{background:linear-gradient(180deg,#5a2330,#3a1620);color:#ffb0a6;border-color:#a85a5a #2a0e12 #2a0e12 #a85a5a}
.btn.evrisk:hover{filter:brightness(1.3)}

.btn,.sysbtn,#endTurn,.itembtn{
 clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px);
 border-width:2px;border-style:solid}

.sysbtn:active:not(:disabled){border-color:#10162c #4a5a8a #4a5a8a #10162c}
.btn{border-color:#c8ae5e #3a2c0e #3a2c0e #c8ae5e;background:linear-gradient(180deg,#ffd76a,#d8a83e);color:#221a04}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){border-color:#3a2c0e #c8ae5e #c8ae5e #3a2c0e}
.btn.ghost{border-color:#4a5a8a #10162c #10162c #4a5a8a;background:linear-gradient(180deg,#1c2748,#111a33);color:#9aa4c0}
#endTurn{border-color:#b09a4e #201a08 #201a08 #b09a4e;background:linear-gradient(180deg,#243158,#141d3d)}
#endTurn:hover{filter:brightness(1.25)}

.conOpt{clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
 border-width:1.5px;background:linear-gradient(180deg,#1a2444,#141c38)}
.trk{clip-path:polygon(5px 0,calc(100% - 5px) 0,100% 5px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px),0 5px)}
.pileTag,.stile,.pricetag,#dustHud,#blockBadge{clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
.mapnode{clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
.panel{position:relative;border:1px solid #3a4670;outline:1px solid #26325a;outline-offset:5px}
.panel::before{content:'✦';position:absolute;top:7px;left:13px;color:#5a6a9a;font-size:13px}
.panel::after{content:'✦';position:absolute;top:7px;right:13px;color:#5a6a9a;font-size:13px}

/* 초상 — talk-sheet가 있으면 이미지, 없으면 절차 도트 폴백 */
function faceImg(key,h){
 const fr=USER_ART['al_'+key];
 if(!fr)return pxArt('al_'+key,h,'pface');
 return `<img class="px aface pface" data-al="${key}" src="${fr[0]}" style="height:${h}px">`;
}
/* 대기 깜빡임 — 평균 약 3.5초마다 140ms 눈감음 */
setInterval(()=>{
 if(Math.random()>0.4)return;
 document.querySelectorAll('img.aface').forEach(im=>{
  const fr=USER_ART['al_'+im.dataset.al];if(!fr)return;
  im.src=fr[3];setTimeout(()=>{if(im.isConnected)im.src=fr[0];},140);
 });
},1400);
/* 말하기 립싱크 — 엶→활짝→엶→기본 4박 135ms */
function mouthTalk(key){
 const fr=USER_ART['al_'+key];if(!fr)return;
 const seq=[1,2,1,0];let i=0;
 const tick=()=>{
  document.querySelectorAll(`img.aface[data-al="${key}"]`).forEach(im=>{im.src=fr[seq[i]];});
  if(++i<seq.length)setTimeout(tick,135);
 };
 tick();
}

/* 런렝스 도트 렌더러 — px 행 문자열('.'=투명, 0~9a~z=팔레트 인덱스) */
function pxArt(key,size,cls){
 const a=PIXEL_ART[key];if(!a)return '';
 let r='';
 for(let y=0;y<a.h;y++){
  const row=a.px[y];let x=0;
  while(x<a.w){
   const ch=row[x];if(ch==='.'){x++;continue;}
   let x2=x+1;while(x2<a.w&&row[x2]===ch)x2++;
   r+=`<rect x="${x}" y="${y}" width="${x2-x}" height="1" fill="${a.pal[parseInt(ch,36)]}"/>`;
   x=x2;
  }
 }
 return `<svg class="px ${cls||''}" width="${size}" height="${Math.round(size*a.h/a.w)}" viewBox="0 0 ${a.w} ${a.h}" shape-rendering="crispEdges">${r}</svg>`;
}
function shapePos(c,i){
 const sh=CONST_SHAPES[c],[cx,cy]=CONS[c].sky;
 if(!sh)return [cx,cy];
 const p=sh.stars[i%sh.stars.length];
 return [cx+p[0]*0.55,cy+p[1]*0.55];
}
/* 카드 성도 패널 — 정식 별선(점선) + 밝기별 별 점 + 잔별 */
function starChartSVG(c,hi){
 const sh=CONST_SHAPES[c];if(!sh)return '';
 const pts=sh.stars.map(p=>[((p[0]+12.6)*3.97).toFixed(1),((p[1]+8.4)*3.97).toFixed(1)]);
 let dust='';
 for(let i=0;i<22;i++){const q=((i*73)%97)+i;dust+=`<circle cx="${(q*1.03)%100}" cy="${(q*2.71)%67}" r=".45" fill="#5a6f9f" opacity=".6"/>`;}
 const segs=sh.segs.map(([a,b])=>`<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${pts[b][0]}" y2="${pts[b][1]}" stroke="#9ab8e8" stroke-width=".8" stroke-dasharray="2.2 2.2" opacity=".85"/>`).join('');
 const hiSet=hi||[];
 const stars=sh.stars.map((p,i)=>{
  if(hiSet.includes(i))return `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${(1.5+p[2]*0.55).toFixed(1)}" fill="#ffd76a"/>`+
   `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${(3.4+p[2]*0.6).toFixed(1)}" fill="none" stroke="#ffd76a" stroke-width=".8" opacity=".85"/>`;
  return `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${(0.9+p[2]*0.45).toFixed(1)}" fill="#f4f8ff"/>`;
 }).join('');
 return `<svg viewBox="0 0 100 67" preserveAspectRatio="xMidYMid meet">${dust}${segs}${stars}</svg>`;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function eul(n){return [0,1,3,6,7,8].includes(n%10)?'을':'를';}
function cardName(id){const d=STARS[id];return `${CONS[d.con].name} ${d.by}`+(d.name?` <small>(${d.name})</small>`:'');}
function stripTags(s){return s.replace(/<[^>]*>/g,'');}
function hasRelic(k){return R.relics.includes(k);}
function wpickStar(){
 const pool=Object.keys(STARS);
 const tot=pool.reduce((s,id)=>s+GRADE_W[STARS[id].rank],0);
 let r=Math.random()*tot;
 for(const id of pool){r-=GRADE_W[STARS[id].rank];if(r<=0)return id;}
 return pool[pool.length-1];
}

/* ── 강화: 주 효과 1개만 (사용자 확정 우선순위 — 피해·성막 > 물질·뽑기 > 기타) ── */
function upFx(fx){
 const f=JSON.parse(JSON.stringify(fx));
 if(f.dmg!=null){f.dmg+=(f.hits||1)>1?1:3;return f;}
 if(f.randDmg){f.randDmg=[f.randDmg[0]+1,f.randDmg[1]+3];return f;}
 if(f.block!=null){f.block+=3;return f;}
 if(f.randBlock){f.randBlock=[f.randBlock[0]+1,f.randBlock[1]+3];return f;}
 if(f.mana){f.mana+=1;return f;}
 if(f.draw){f.draw+=1;return f;}
 if(f.poison){f.poison+=2;return f;}
 if(f.heal){f.heal+=2;return f;}
 if(f.vuln){f.vuln+=1;return f;}
 if(f.weak){f.weak+=1;return f;}
 if(f.thorns){f.thorns+=1;return f;}
 if(f.str){f.str+=1;return f;}
 f._costDown=1;return f;   /* 수치가 없는 기믹 카드 → 비용 −1 */
}
function partFx(id,up){return up?upFx(STARS[id].fx):STARS[id].fx;}
function cardFx(en){const l=[partFx(en.id,en.up)];if(en.id2)l.push(partFx(en.id2,en.up2));return l;}
function partCost(id,up){const base=STARS[id].cost;return up&&partFx(id,up)._costDown?Math.max(0,base-1):base;}
function costOf(en){return en.id2?Math.max(partCost(en.id,en.up),partCost(en.id2,en.up2)):partCost(en.id,en.up);}
function countAs(en){return en.id2?2:1;}
function canMergeWith(a,b){return !a.id2&&!b.id2&&STARS[a.id].con===STARS[b.id].con;}

function genMap(){
 const ROWS=12,nodes=[];
 for(let r=0;r<ROWS;r++){
  const cnt=r===ROWS-1?1:(r===0?3:rand(2,3));
  let cols=r===ROWS-1?[1]:shuffle([0,1,2]).slice(0,cnt).sort();
  for(const c of cols)nodes.push({i:nodes.length,r,c,type:'battle',edges:[],visited:false});
 }
 const rowNodes=r=>nodes.filter(n=>n.r===r);
 for(let r=0;r<ROWS-1;r++){
  const cur=rowNodes(r),nxt=rowNodes(r+1);
  for(const a of cur){
   const tg=r+1===ROWS-1?nxt:nxt.filter(b=>Math.abs(b.c-a.c)<=1);
   const pick=shuffle(tg.slice()).slice(0,Math.max(1,rand(1,2)));
   for(const b of pick)if(!a.edges.includes(b.i))a.edges.push(b.i);
  }
  for(const b of nxt){ /* 진입 보장 */
   if(!cur.some(a=>a.edges.includes(b.i))){
    const near=cur.filter(a=>Math.abs(a.c-b.c)<=1);
    const a=(near.length?near:cur)[0];a.edges.push(b.i);
   }
  }
 }
 /* 종류 배치 */
 const setOne=(r,type,excl)=>{
  const cand=rowNodes(r).filter(n=>n.type==='battle'&&!(excl||[]).includes(n.i));
  if(cand.length){const n=cand[rand(0,cand.length-1)];n.type=type;return n;}
  return null;
 };
 rowNodes(11)[0].type='boss';
 for(const n of rowNodes(4))n.type='elite';
 for(const n of rowNodes(8))n.type='elite';
 setOne(3,'shop');setOne(9,'shop');
 setOne(6,'rest');setOne(10,'rest');
 setOne(rand(2,3)===2?2:5,'forge')||setOne(2,'forge')||setOne(5,'forge');
 setOne(rand(6,7),'elite'); /* 선택 정예 → 2회 확정 + 최대 3회 */
 let ev=0;
 for(const r of shuffle([1,2,5,7,10,3,9])){if(ev>=4)break;if(setOne(r,'event'))ev++;}
 /* 적 배정 (막별 풀) */
 const AP=(R.act===2?POOL2:POOL),usedElite=[];
 for(const n of nodes){
  if(n.type==='battle'){const p=AP[n.r<=3?'easy':'mid'];n.enemy=p[rand(0,p.length-1)];}
  if(n.type==='elite'){
   const remain=AP.elite.filter(e=>!usedElite.includes(e));
   n.enemy=(remain.length?remain:AP.elite)[rand(0,(remain.length?remain:AP.elite).length-1)];
   usedElite.push(n.enemy);
  }
  if(n.type==='boss')n.enemy=R.act===2?'blackhole':'m42';
 }
 return nodes;
}

function enemyTurn(){

 }

 if(act.atk!=null){
  const h=act.hits||1;let tot=0,stolen=0;

   const b=Math.min(S.block,n);S.block-=b;stolen+=b;const hit=n-b;
   R.hp=Math.max(0,R.hp-hit);tot+=hit;

  }

  if(E.blockSteal&&stolen>0){E.block+=Math.floor(stolen/2);log(`성막 흡수 — ${Math.floor(stolen/2)}`);}

function intentTxt(){

 if(act.atk!=null){
  let n=act.atk+(E.ab||0)+E.str+nightBonus();if(E.weak)n=Math.floor(n*0.75);
  parts.push(`⚔ 피해 ${n}${(act.hits||1)>1?`×${act.hits}`:''}`);
 }
 if(act.blk)parts.push(`🛡 성막 ${act.blk}`);
 if(act.weakP)parts.push(`☁ 약화 ${act.weakP}`);
 if(act.seal)parts.push(`⛓ 손패 봉인`);
 if(act.conSeal)parts.push(`🌫 별자리 봉인`);
 if(act.pulsar)parts.push(`🌀 성막 흡수`);
 if(act.eat)parts.push(`🕳 카드 흡수`);
 if(act.grav)parts.push(`🌀 중력(물질 −1)`);
 if(act.charge)parts.push(`⚡ ${act.charge}`);
 const nb=nightBonus();
 let tail='';
 if(nb>0)tail=` · 🌙 깊은 밤 +${nb}`;
 else if(E.nightAt&&(E._t+1)>=E.nightAt-2)tail=' · 🌙 깊은 밤 임박';
 return parts.join(' + ')+tail;
}

  <div class="evchoices">
   <button class="btn evrisk" onclick="evChoose('${ev.id}',true)">⚠ ${ev.risk.t}</button>
   <button class="btn ghost" onclick="evChoose('${ev.id}',false)">${ev.safe.t}</button>
  </div>
 </div>`;
 $('rewardOvl').classList.add('show');
}
window.evChoose=function(id,risky){
 const ev=EVENTS.find(e=>e.id===id);
 const stay=(risky?ev.risk:ev.safe).run();
 if(R.hp<=0){lose('가혹한 우주');return;}
 if(!stay)backToMap();
};

/* ═══════════ 종료 ═══════════ */
function clearRun(){
 if(R.act===1){
  R.act=2;R.hp=Math.min(R.maxHp,R.hp+15);R.dust+=80;R.pos=-1;R.map=genMap();
  $('endPanel').innerHTML=`<h2>🌙 1막 완주 — 더 깊은 밤으로</h2>
   <p>오리온 대성운을 잠재웠습니다. HP <b>15</b> 회복 · 별빛 가루 <b>+80</b><br>
   2막의 하늘에는 은하핵의 블랙홀이 도사립니다. 적은 더 강해집니다.</p>
   <button class="btn" onclick="$('endOvl').classList.remove('show');over=false;showMap()">2막으로</button>`;
  $('endOvl').classList.add('show');
  return;
 }
 $('endPanel').innerHTML=`<h2>🌌 여정 완주!</h2>
  <p>은하핵의 블랙홀을 잠재웠습니다. 덱 ${R.deck.length}장 · HP ${R.hp}/${R.maxHp} · 가루 ${R.dust} · 승리 ${R.wins}회<br>
  조력자 ${R.allies.map(k=>ALLIES[k].n).join('·')||'없음'} · 유물 ${R.relics.map(k=>RELICS[k].n).join('·')||'없음'}</p>
  <p style="font-size:12px">${R.deck.map(en=>stripTags(cardName(en.id))+(en.up?'+':'')+(en.id2?'(쌍성)':'')).join(' · ')}</p>
  <button class="btn" onclick="location.reload()">새 여정</button>`;
 $('endOvl').classList.add('show');
}
function lose(cause){
 over=true;
 $('endPanel').innerHTML=`<h2>별이 지다…</h2>
  <p>${cause||(E?E.name:'우주')}에게 쓰러졌습니다. (승리 ${R.wins}회)</p>
  <button class="btn" onclick="location.reload()">다시 도전</button>`;
 $('endOvl').classList.add('show');
}

/* ═══════════ 런 시작 ═══════════ */
function startRun(){
 R.hp=70;R.maxHp=70;R.dust=0;R.allies=[];R.relics=[];R.items=[];R.usedEvents=[];R.pos=-1;R.wins=0;R.act=1;
 /* 기본덱 11장 = 큰곰·작은곰·카시오페이아 (중복 허용 — 2026-08-25 사용자 지시) */
 R.deck=['caph','tsih','tsih','ruchbah','phecda','phecda','megrez','yildun','yildun','pherkad','kochab']
   .map(id=>({id,basic:true}));
 R.map=genMap();
 showAllyPick(true,()=>{$('rewardOvl').classList.remove('show');showMap();});
}

/* ═══ 전체 덱 · 설정(도움말) 오버레이 ═══ */
const KEYWORD_HELP=`중독: 적 턴마다 그만큼 피해를 주고 1 줄어든다 (성막 무시)
취약: 받는 피해 +50% · 약화: 주는 피해 −25%
가시·반격: 공격당하면 그만큼 되돌려준다 · 관통: 성막을 무시한다
힘: 공격마다 피해 추가 · 소멸: 이 전투에서 제외된다
성좌: 한 턴에 같은 별자리 별을 필요 수만큼 내면 완성 — 게임 규칙을 비트는 파격 효과 (어려운 3성일수록 강력)
깊은 밤: 전투가 길어지면 적 공격이 매 턴 +1씩 커진다
조작: 카드를 위로 드래그해 발동 (Esc = 취소) · 숫자키 1~9 = 카드 내기 · Space/E = 턴 종료 · [전투 로그] 버튼 = 지난 기록`;
function showDeckOvl(){
 $('utilPanel').innerHTML=`<h2>전체 덱 — ${R.deck.length}장</h2>
  <p>여정에서 모은 별 전부. 쌍성·강화 상태가 함께 보입니다.</p>
  <div class="optRow">${R.deck.map(en=>cardHTML(en)).join('')||'<p>덱이 비었습니다</p>'}</div>
  <button class="btn" onclick="closeUtil()">닫기</button>`;
 $('utilOvl').classList.add('show');
}
function showPileOvl(kind){
 if(!S)return;
 let list,title,desc;
 if(kind==='draw'){
  list=[...S.drawPile].sort((a,b)=>{const A=STARS[a.id],B2=STARS[b.id];
   return A.con===B2.con?A.rank-B2.rank:(A.con<B2.con?-1:1);});
  title=`뽑을 카드 — ${S.drawPile.length}장`;
  desc='앞으로 나올 별들입니다 (나오는 순서는 밤하늘만 압니다)';
 }else{
  list=[...S.discard].reverse();
  title=`버림 더미 · 블랙홀 — ${S.discard.length}장`;
  desc='이번 전투에서 쓴 별들입니다 (최근에 쓴 것부터)';
 }
 $('utilPanel').innerHTML=`<h2>${title}</h2><p>${desc}</p>
  <div class="optRow">${list.map(en=>cardHTML(en)).join('')||'<p style="color:#767f9c">비었습니다</p>'}</div>
  ${kind==='discard'&&S.vanished.length?`<h2 style="font-size:15px">소멸 — ${S.vanished.length}장 (돌아오지 않음)</h2>
   <div class="optRow">${S.vanished.map(en=>cardHTML(en)).join('')}</div>`:''}
  <button class="btn" onclick="closeUtil()">닫기</button>`;
 $('utilOvl').classList.add('show');
}
function showHelpOvl(){
 $('utilPanel').innerHTML=`<h2>설정 · 도움말</h2>
  <p style="text-align:left;white-space:pre-line;font-size:12.5px;line-height:1.9;max-width:560px;margin:0 auto 14px">${KEYWORD_HELP}</p>
  <button class="btn" onclick="closeUtil()">닫기</button>`;
 $('utilOvl').classList.add('show');
}
function closeUtil(){$('utilOvl').classList.remove('show');}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&dragCancel())return;
 if(e.key==='Escape'&&$('logPanel')&&$('logPanel').classList.contains('show')){$('logPanel').classList.remove('show');return;}
 if($('rewardOvl').classList.contains('show')||$('endOvl').classList.contains('show'))return;
 if($('utilOvl').classList.contains('show')){if(e.key==='Escape')closeUtil();return;}
 if(!S||$('app').style.display==='none')return;
 if(e.code==='Space'||e.key==='e'||e.key==='E'){e.preventDefault();endTurn();}
 const n=parseInt(e.key);
 if(n>=1&&n<=9){
  const el=document.querySelector(`#hand .card[data-idx="${n-1}"]`);
  if(el)FLY_SRC=el.getBoundingClientRect();
  playCard(n-1);
 }
});

/* ═══════════ v0.9 드래그 발동 — 입력 레이어 (엔진 playCard 무변경) ═══════════ */
let DRAG=null;
function dragCancel(){
 if(!DRAG)return false;
 DRAG=null;
 document.body.classList.remove('dragging');
 renderAll();
 return true;
}
$('hand').addEventListener('pointerdown',e=>{
 if(over||!S)return;
 const el=e.target.closest('.card');if(!el||el.dataset.idx==null)return;
 const i=+el.dataset.idx,en=S.hand[i];if(!en)return;
 if(!canPlay(en)){
  el.classList.remove('noplay');void el.offsetWidth;el.classList.add('noplay');
  $('manaOrb').classList.remove('shake');void $('manaOrb').offsetWidth;$('manaOrb').classList.add('shake');
  return;
 }
 DRAG={i,el,sx:e.clientX,sy:e.clientY,lifted:false};
 e.preventDefault();
});
document.addEventListener('pointermove',e=>{
 if(!DRAG)return;
 if(!DRAG.lifted){
  if(Math.hypot(e.clientX-DRAG.sx,e.clientY-DRAG.sy)<8)return;
  DRAG.lifted=true;
  DRAG.el.classList.add('dragcard');
  document.body.classList.add('dragging');
  clearTimeout(kwT);$('kwTip').classList.remove('show');
 }
 DRAG.el.style.left=(e.clientX-84)+'px';
 DRAG.el.style.top=(e.clientY-129)+'px';
});
document.addEventListener('pointerup',e=>{
 if(!DRAG)return;
 const d=DRAG;DRAG=null;
 document.body.classList.remove('dragging');
 if(!d.lifted)return;                        /* 클릭만 = 발동 없음 */
 const hr=$('hand').getBoundingClientRect();
 if(e.clientY<hr.top-4){FLY_SRC=d.el.getBoundingClientRect();playCard(d.i);} /* 전장에 놓음 = 발동 */
 else renderAll();                           /* 손패 안 = 취소(원위치) */
});
document.addEventListener('pointercancel',dragCancel);

/* ── 카드 호버 → 보드에서 다음에 켤 별을 미리 비춘다 ── */
let _pv=null,kwT=null;
function showKwTip(el,en){
 const txt=stripTags(cardText(en))+' '+stripTags(bonusText(CONS[STARS[en.id].con].bonus));
 const found=Object.keys(KW).filter(k=>txt.includes(k));
 if(!found.length)return;
 const tip=$('kwTip');
 tip.innerHTML='<div style="color:#767f9c;font-size:9.5px;letter-spacing:2px;margin-bottom:3px">키워드</div>'+
  found.map(k=>`<div><b>${k}</b> — ${KW[k]}</div>`).join('');
 const r=el.getBoundingClientRect();
 tip.style.left=Math.min(window.innerWidth-266,r.right+10)+'px';
 tip.style.top=Math.max(8,r.top-30)+'px';
 tip.classList.add('show');
}
function previewStar(c,on){
 clearTimeout(kwT);
 const kt=$('kwTip');if(kt&&!on)kt.classList.remove('show');
 if(_pv){_pv.halo.remove();if(_pv.chip)_pv.chip.classList.remove('trkhot');_pv=null;}
 if(!on||!c||!S||!S.board||!S.board[c]||S.board[c].done)return;
 const b=S.board[c];
 const s=b.stars[b.lit%b.stars.length];
 const h=document.createElementNS(SVGNS,'circle');
 h.setAttribute('cx',s.getAttribute('cx'));h.setAttribute('cy',s.getAttribute('cy'));
 h.setAttribute('r','1.6');h.setAttribute('fill','none');
 h.setAttribute('stroke','#ffd76a');h.setAttribute('stroke-width','.3');h.setAttribute('opacity','.85');
 h.style.animation='halopulse 1.1s ease-in-out infinite';
 $('skysvg').appendChild(h);
 const chip=document.querySelector(`.trk[data-con="${c}"]`);
 if(chip)chip.classList.add('trkhot');
 _pv={halo:h,chip};
}
$('hand').addEventListener('mouseover',e=>{
 const el=e.target.closest('.card');if(!el||el.dataset.idx==null||!S)return;
 const en=S.hand[+el.dataset.idx];if(!en)return;
 previewStar(STARS[en.id].con,true);
 clearTimeout(kwT);
 kwT=setTimeout(()=>showKwTip(el,en),550);
});
$('hand').addEventListener('mouseout',e=>{
 if(e.target.closest('.card'))previewStar(null,false);
});

startRun();
</script>
</body>
</html>

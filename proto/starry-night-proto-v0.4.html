<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starry Night — 프로토타입 v0.4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% -20%, #1b2547 0%, #0b1020 55%, #070b16 100%);color:#e8ecf7;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden}
#app,#mapScr{max-width:1100px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:10px 14px}
header{display:flex;align-items:center;gap:12px;padding-bottom:6px;flex-wrap:wrap}
header h1{font-size:18px;letter-spacing:2px;color:#ffd76a}
header .sub{font-size:12px;color:#9aa4c0}
#relicRow{display:flex;gap:5px}
.relic{font-size:11px;background:#1d2742;border:1px solid #6b5a2e;color:#ffe9b0;border-radius:4px;padding:1px 6px;cursor:default}
#dustTag{margin-left:auto;font-size:13px;color:#ffe9b0}
#stageTag{font-size:13px;color:#8fd3ff}

/* ── 맵 ── */
#mapWrap{flex:1;overflow-y:auto;border:1px solid #26325a;border-radius:10px;background:radial-gradient(ellipse at 50% 120%, #141d3d 0%, #0a0f22 70%);position:relative}
#mapInner{position:relative;width:640px;margin:0 auto}
#mapSvg{position:absolute;inset:0;width:100%;height:100%}
.mapnode{position:absolute;width:84px;height:52px;transform:translate(-50%,-50%);border-radius:9px;border:1.5px solid #3a4670;background:#141d3d;color:#aab4d4;font-size:11.5px;text-align:center;cursor:default;line-height:1.3;padding-top:8px}
.mapnode b{display:block;font-size:13px}
.mapnode.avail{border-color:#ffd76a;color:#ffe9b0;cursor:pointer;box-shadow:0 0 12px rgba(255,215,106,.4)}
.mapnode.avail:hover{background:#26325a}
.mapnode.here{border-color:#8fd3ff;color:#8fd3ff;box-shadow:0 0 12px rgba(140,210,255,.5)}
.mapnode.past{opacity:.35}
.mapnode.elite{border-style:double;border-width:3.5px}
#mapHint{font-size:12px;color:#9aa4c0;text-align:center;padding:6px}

/* ── 적 구역 ── */
#enemyZone{display:flex;align-items:center;gap:18px;justify-content:center;padding:6px 0}
#enemySprite{width:88px;height:88px;border-radius:50%;flex:none;box-shadow:0 0 28px rgba(255,120,90,.35)}
.sp-mars{background:radial-gradient(circle at 35% 30%, #ff9a6b, #b33a1f 65%, #6e1d0e)}
.sp-shard{background:radial-gradient(circle at 35% 30%, #d8dce8, #7a8298 60%, #3a4152);border-radius:22%}
.sp-comet{background:radial-gradient(circle at 30% 30%, #eafcff, #7fd8e8 45%, #1c5a7a)}
.sp-moonlet{background:radial-gradient(circle at 35% 30%, #e8e2d2, #a89c7c 60%, #5a5040)}
.sp-titan{background:radial-gradient(circle at 35% 30%, #ffe2a8, #c8963e 60%, #6e4a14)}
.sp-rogue{background:radial-gradient(circle at 35% 30%, #b8c4ff, #4a5ab3 60%, #1c2260)}
.sp-pleiades{background:radial-gradient(circle at 30% 30%, #dff1ff, #6fa8ff 40%, #1c3a7a 75%);box-shadow:0 0 34px rgba(140,190,255,.55)}
.sp-hyades{background:radial-gradient(circle at 30% 30%, #ffe8d0, #e8a86f 45%, #7a4a1c 80%);box-shadow:0 0 30px rgba(230,170,110,.5)}
.sp-m1{background:radial-gradient(circle at 40% 40%, #d0fff2, #6fe8c8 40%, #1c7a5f 80%);box-shadow:0 0 34px rgba(110,230,200,.5)}
.sp-m42{background:radial-gradient(circle at 40% 45%, #ffd7f0, #b76bff 45%, #3a1c6e 80%);box-shadow:0 0 40px rgba(200,120,255,.6)}
#enemyInfo{min-width:300px}
#enemyName{font-size:16px;font-weight:700}
#enemyAbility{font-size:11.5px;color:#e8a86f}
#enemyIntent{font-size:13px;color:#ffb56b;margin:3px 0}
.hpbar{width:300px;height:14px;background:#222b45;border-radius:7px;overflow:hidden;border:1px solid #38436b}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff5f6d,#ff9a6b);transition:width .25s}
.stat{font-size:12px;color:#c7ccd6;margin-top:3px}
.chips{margin-top:4px;font-size:11.5px;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#1d2742;border:1px solid #3a4670;border-radius:4px;padding:1px 6px}
.chip.bad{border-color:#8a4a4a;color:#ffb0a6}
.chip.good{border-color:#4a8a5c;color:#a6ffc0}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ── 밤하늘 ── */
#sky{position:relative;flex:1;min-height:130px;border:1px solid #26325a;border-radius:10px;background:radial-gradient(ellipse at 50% 120%, #141d3d 0%, #0a0f22 70%);overflow:hidden}
#skysvg{position:absolute;inset:0;width:100%;height:100%}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:26px;font-weight:800;color:#ffd76a;text-shadow:0 0 18px rgba(255,215,106,.8);opacity:0;pointer-events:none;transition:opacity .3s;text-align:center}
#banner small{display:block;font-size:13px;color:#ffe9b0;font-weight:400;margin-top:2px}
#banner.show{opacity:1}
#log{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:#9aa4c0;line-height:1.5;pointer-events:none;max-width:64%}
#log .l0{color:#dfe6ff}

/* ── 트래커 ── */
#tracker{display:flex;gap:8px;flex-wrap:wrap;padding:6px 2px;font-size:12px}
.trk{border:1px solid #2c3760;border-radius:6px;padding:3px 8px;color:#aab4d4;background:#121a33}
.trk b{color:#e8ecf7}
.trk.ready{border-color:#7ee08a;color:#a6ffc0;box-shadow:0 0 8px rgba(120,255,150,.25)}
.trk.done{border-color:#ffd76a;color:#ffd76a}
.trk.sealed{border-color:#8a4a4a;color:#ffb0a6}

/* ── 플레이어 줄 ── */
#playerBar{display:flex;align-items:center;gap:12px;padding:6px 0;flex-wrap:wrap}
#manaOrb{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #9fd8ff, #2f6fd0 60%, #16336e);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;box-shadow:0 0 16px rgba(90,160,255,.5);flex:none}
#pstats{font-size:13px;line-height:1.55}
#pchips{display:flex;gap:6px;font-size:11.5px}
#skillRow,#itemRow{display:flex;gap:6px}
#skillRow{margin-left:auto}
.skillbtn,.itembtn{background:#18213e;border:1px solid #3a4670;color:#dfe6ff;border-radius:7px;padding:5px 9px;font-size:10.5px;cursor:pointer;text-align:left;line-height:1.35}
.skillbtn b{display:block;font-size:12px;color:#8fd3ff}
.itembtn{border-color:#5a8a4a;color:#c8f0b8}
.skillbtn.off,.itembtn.off{opacity:.35;cursor:default}
#endTurn{background:#ffd76a;color:#221a04;border:0;border-radius:8px;font-size:15px;font-weight:800;padding:12px 22px;cursor:pointer;flex:none}
#piles{font-size:12px;color:#9aa4c0;text-align:right;line-height:1.5;flex:none}

/* ── 카드 ── */
#hand{display:flex;gap:8px;justify-content:center;align-items:flex-end;min-height:196px;padding-bottom:4px}
.card{width:136px;height:190px;background:linear-gradient(180deg,#1a2340,#111831);border:1.5px solid var(--gc,#556);border-radius:9px;padding:7px 8px;cursor:pointer;position:relative;transition:transform .12s;display:flex;flex-direction:column;flex:none}
#hand .card:hover{transform:translateY(-26px) scale(1.24);z-index:5}
.card.unplayable{filter:grayscale(.7) brightness(.6);cursor:default}
.card.sealedcard{filter:grayscale(1) brightness(.45);cursor:default;outline:2px dashed #8a4a4a}
.card.willfinish{box-shadow:0 0 14px rgba(255,215,106,.75);border-color:#ffd76a}
.card.upframe{border-color:#9fc8e8;box-shadow:0 0 8px rgba(160,200,230,.35)}
.card.mergeframe{border-color:#b06fe8;box-shadow:0 0 8px rgba(176,111,232,.4)}
.cchip{position:absolute;top:-8px;right:-6px;font-size:10px;font-weight:800;border-radius:4px;padding:1px 5px}
.cchip.up{background:#9fc8e8;color:#0e1a26}
.cchip.merge{background:#b06fe8;color:#1c0e26}
.cname{font-size:11px;font-weight:700;color:var(--gc);line-height:1.25;min-height:28px;padding-left:14px}
.cname small{color:#c7ccd6;font-weight:400}
.ccost{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #9fd8ff, #2f6fd0 70%);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff}
.ctype{font-size:10px;color:#9aa4c0;margin:2px 0}
.cfx{flex:1;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#e8ecf7;overflow:hidden}
.cfx span{display:block;text-align:center;line-height:1.4}
.cfx b{color:#ffd76a}
.ccon{font-size:10px;color:#8fd3ff;text-align:center;border-top:1px dashed #2c3760;padding-top:3px}
.clore{display:none;font-size:9.5px;color:#9aa4c0;line-height:1.3;padding-top:3px;font-style:italic}
#hand .card:hover .clore{display:block}
.num{position:absolute;font-size:20px;font-weight:800;pointer-events:none;animation:rise 1s forwards}
@keyframes rise{to{transform:translateY(-46px);opacity:0}}

/* ── 오버레이 ── */
.ovl{position:fixed;inset:0;background:rgba(5,8,18,.88);display:none;align-items:center;justify-content:center;z-index:20}
.ovl.show{display:flex}
.panel{background:#121a33;border:1px solid #34406b;border-radius:12px;padding:24px 28px;max-width:860px;max-height:92vh;overflow:auto;text-align:center}
.panel h2{color:#ffd76a;font-size:19px;margin-bottom:6px}
.panel p{font-size:13px;color:#aab4d4;margin-bottom:14px}
.optRow{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.conOpt{width:190px;border:1.5px solid #3a4670;border-radius:9px;padding:12px;cursor:pointer;background:#18213e}
.conOpt:hover{border-color:#ffd76a}
.conOpt b{font-size:15px}
.conOpt .idn{color:#8fd3ff;font-size:12px;margin:4px 0}
.conOpt .own{color:#9aa4c0;font-size:11.5px;line-height:1.4}
.card.pick{cursor:pointer}
.card.picked{outline:2.5px solid #7ee08a;box-shadow:0 0 12px rgba(120,255,150,.5)}
.card.pick:hover{transform:scale(1.06)}
.btn{background:#ffd76a;color:#221a04;border:0;border-radius:7px;font-size:14px;font-weight:700;padding:10px 20px;cursor:pointer;margin:4px 5px}
.btn.ghost{background:transparent;color:#9aa4c0;border:1px solid #3a4670}
.btn:disabled{opacity:.4;cursor:default}
#kwHelp{font-size:10.5px;color:#767f9c;text-align:center;padding-bottom:4px}
</style>
</head>
<body>
<!-- ═══ 맵 화면 ═══ -->
<div id="mapScr" style="display:none">
  <header>
    <h1>STARRY NIGHT</h1><span class="sub">성도(맵) — 길을 고르세요</span>
    <div id="relicRowM" class="chips"></div>
    <span id="dustTagM" style="margin-left:auto;font-size:13px;color:#ffe9b0"></span>
    <span id="hpTagM" style="font-size:13px;color:#ffb0a6"></span>
  </header>
  <div id="mapWrap"><div id="mapInner"><svg id="mapSvg"></svg></div></div>
  <div id="mapHint">⚔ 전투 · ☠ 중간보스 · ✧ 상점 · ♨ 휴식 · ⚒ 대장간 · ? 이벤트 · ★ 보스 — 빛나는 관문을 눌러 이동</div>
</div>

<!-- ═══ 전투 화면 ═══ -->
<div id="app" style="display:none">
  <header>
    <h1>STARRY NIGHT</h1><span class="sub">v0.4</span>
    <div id="relicRow" class="chips"></div>
    <span id="dustTag"></span><span id="stageTag"></span>
  </header>
  <div id="enemyZone">
    <div id="enemySprite"></div>
    <div id="enemyInfo">
      <div id="enemyName"></div>
      <div id="enemyAbility"></div>
      <div id="enemyIntent"></div>
      <div class="hpbar"><i id="ehp"></i></div>
      <div class="stat" id="ehpTxt"></div>
      <div class="chips" id="echips"></div>
    </div>
  </div>
  <div id="sky">
    <svg id="skysvg" viewBox="0 0 100 60" preserveAspectRatio="none"></svg>
    <div id="banner"></div>
    <div id="log"></div>
  </div>
  <div id="tracker"></div>
  <div id="playerBar">
    <div id="manaOrb">3</div>
    <div>
      <div id="pstats"></div>
      <div id="pchips" class="chips"></div>
    </div>
    <div id="itemRow"></div>
    <div id="skillRow"></div>
    <button id="endTurn" onclick="endTurn()">턴 종료 (Space)</button>
    <div id="piles"></div>
  </div>
  <div id="hand"></div>
  <div id="kwHelp">중독: 적 턴마다 피해 후 1 감소(성막 무시) · 취약: 받는 피해 +50% · 약화: 주는 피해 −25% · 가시: 공격당하면 반사 · 관통: 성막 무시 · 힘: 공격마다 추가 · 소멸: 이 전투에서 제외 — 숫자키 1~9 = 카드</div>
</div>

<div class="ovl" id="rewardOvl"><div class="panel" id="rewardPanel"></div></div>
<div class="ovl" id="endOvl"><div class="panel" id="endPanel"></div></div>

<script>
'use strict';
/* ═══════════ 데이터 — card-design 스킬(환율·등급 예산·기믹 어휘) 적용 ═══════════
   환율: 물질1 = 피해6 = 성막5 = 뽑기1 = 회복4 = 중독3 = 취약/약화1턴
   등급 예산: α150 · β134 · γ122 · δ110 · ε100 (%) — 조건·스케일링은 +20~30% 허용
   v0.3 재설계: 순수 수치 카드는 시작 덱 급 + α 피니셔뿐, 나머지는 기믹 어휘에서
   고유한 작동 방식 하나씩 (StS 265장 분석 반영)                                */

const GRADE_CLR={1:'#ffd76a',2:'#c9a4ff',3:'#8fd3ff',4:'#9fe6a0',5:'#c7ccd6'};
const GRADE_NAME={1:'으뜸별',2:'버금별',3:'셋째별',4:'넷째별',5:'다섯째별'};
const GRADE_W={1:.16,2:.34,3:.60,4:.85,5:1.0};
const PRICE={1:90,2:70,3:55,4:40,5:30};

const CONS={
 uma:{name:'큰곰자리',need:3,idn:'성벽',idnDesc:'성막을 쌓으면 그 자체가 무기다',
      bonus:{mode:'passive',turnFx:{block:3},label:'전투 내내 매 턴 성막 3'},sky:[20,22]},
 umi:{name:'작은곰자리',need:2,idn:'길잡이',idnDesc:'물질의 흐름을 다스린다',
      bonus:{mode:'passive',turnFx:{mana:1},label:'전투 내내 매 턴 물질 +1'},sky:[50,10]},
 cas:{name:'카시오페이아자리',need:2,idn:'변광',idnDesc:'운에 맡기고, 나쁜 운은 다시 섞는다',
      bonus:{mode:'instant',fx:{draw:2}},sky:[76,18]},
 ori:{name:'오리온자리',need:3,idn:'사냥',idnDesc:'공격만으로 손을 채우는 사냥꾼',
      bonus:{mode:'passive',onceFx:{str:2},label:'힘 +2 — 전투 지속'},sky:[14,44]},
 gem:{name:'쌍둥이자리',need:2,idn:'짝',idnDesc:'같은 것을 두 번 — 모든 것이 짝으로',
      bonus:{mode:'instant',fx:{dmg:4,hits:2}},sky:[33,38]},
 sco:{name:'전갈자리',need:3,idn:'독침',idnDesc:'중독을 심고, 불리고, 터뜨린다',
      bonus:{mode:'passive',onceFx:{poison:4},flag:'poisonKeep',label:'중독 4 · 이 전투 동안 중독이 줄지 않음'},sky:[86,48]},
 sgr:{name:'궁수자리',need:2,idn:'겨눔',idnDesc:'얇은 화살을 몰아 쏘고 마지막에 겨눈다',
      bonus:{mode:'instant',fx:{dmg:8,pierce:1}},sky:[64,52]},
 leo:{name:'사자자리',need:2,idn:'포효',idnDesc:'취약을 새기고 왕의 일격으로 벌한다',
      bonus:{mode:'instant',fx:{vuln:2}},sky:[38,54]},
 cyg:{name:'백조자리',need:2,idn:'나래',idnDesc:'오래 나는 날개 — 지킨 것은 다음 턴에도 남는다',
      bonus:{mode:'instant',fx:{block:4,nextTurn:{block:4}}},sky:[60,32]},
 lib:{name:'천칭자리',need:2,idn:'균형',idnDesc:'공격과 수비를 오가면 저울이 보상한다',
      bonus:{mode:'instant',fx:{dmg:6,block:6}},sky:[88,30]},
};

const STARS={
 /* 큰곰 — 성벽 (셋업: 성막 쌓기 → 페이오프: 두베 2배·천칭 α 참조) */
 dubhe:{con:'uma',by:'α',name:'두베',rank:1,cost:2,type:'스킬',fx:{doubleBlock:1},lore:'북두칠성 국자 끝 — 북극성을 가리키는 지극성'},                    // Entrench형 증폭
 merak:{con:'uma',by:'β',name:'메라크',rank:2,cost:2,type:'수비',fx:{block:8,counter:4},lore:'두베와 짝지어 북쪽 길을 여는 지극성'},                       // Flame Barrier형 반격
 phecda:{con:'uma',by:'γ',name:'페크다',rank:3,cost:1,type:'수비',fx:{block:5,thorns:1},lore:'큰곰의 뒷다리 — "넓적다리"라는 뜻'},                        // 1.2 / 1.22 ✓
 megrez:{con:'uma',by:'δ',name:'메그레즈',rank:4,cost:0,type:'수비',fx:{block:3},lore:'국자와 손잡이가 만나는 가장 흐린 일곱째 별'},                       // 시작 덱 급 민무늬
 /* 작은곰 — 길잡이 (물질 조작 아키타입) */
 polaris:{con:'umi',by:'α',name:'북극성',rank:1,cost:1,type:'스킬',fx:{mana:2,draw:1},lore:'천구 북극에 붙박인 길잡이 별 — 모든 별이 그를 돈다'},           // Adrenaline형
 kochab:{con:'umi',by:'β',name:'코카브',rank:2,cost:1,type:'공격',fx:{dmg:4,mana:1},lore:'북극성 이전 시대의 옛 북극성'},                                 // 1.67 / 1.34 ✓
 pherkad:{con:'umi',by:'γ',name:'페르카드',rank:3,cost:1,type:'스킬',fx:{draw:1,mana:1},lore:'코카브와 나란히 "북극의 두 수호자"'},                        // 순환 소품
 yildun:{con:'umi',by:'δ',name:'이을딘',rank:4,cost:1,type:'수비',fx:{block:3,mana:1},lore:'꼬리 한가운데의 조용한 별 — "별"이라는 뜻의 터키어'},           // 1.6 / 1.1 ✓
 /* 카시오페이아 — 변광 (무작위·손패 조작) */
 schedar:{con:'cas',by:'α',name:'셰다르',rank:1,cost:1,type:'스킬',fx:{handRedraw:1},lore:'옥좌에 앉은 왕비의 심장 — "가슴"이라는 뜻'},                    // Calculated Gamble형

const $=id=>document.getElementById(id);

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function eul(n){return [0,1,3,6,7,8].includes(n%10)?'을':'를';}
function cardName(id){const d=STARS[id];return `${CONS[d.con].name} ${d.by}`+(d.name?` <small>(${d.name})</small>`:'');}
function stripTags(s){return s.replace(/<[^>]*>/g,'');}

function wpickStar(){
 const pool=Object.keys(STARS);
 const tot=pool.reduce((s,id)=>s+GRADE_W[STARS[id].rank],0);
 let r=Math.random()*tot;
 for(const id of pool){r-=GRADE_W[STARS[id].rank];if(r<=0)return id;}
 return pool[pool.length-1];
}

/* ── 강화: 주 효과 1개만 (사용자 확정 우선순위 — 피해·성막 > 물질·뽑기 > 기타) ── */
function upFx(fx){
 const f=JSON.parse(JSON.stringify(fx));
 if(f.dmg!=null){f.dmg+=(f.hits||1)>1?1:3;return f;}
 if(f.randDmg){f.randDmg=[f.randDmg[0]+1,f.randDmg[1]+3];return f;}
 if(f.block!=null){f.block+=3;return f;}
 if(f.randBlock){f.randBlock=[f.randBlock[0]+1,f.randBlock[1]+3];return f;}
 if(f.mana){f.mana+=1;return f;}
 if(f.draw){f.draw+=1;return f;}
 if(f.poison){f.poison+=2;return f;}
 if(f.heal){f.heal+=2;return f;}
 if(f.vuln){f.vuln+=1;return f;}
 if(f.weak){f.weak+=1;return f;}
 if(f.thorns){f.thorns+=1;return f;}
 if(f.str){f.str+=1;return f;}
 f._costDown=1;return f;   /* 수치가 없는 기믹 카드 → 비용 −1 */
}
function partFx(id,up){return up?upFx(STARS[id].fx):STARS[id].fx;}
function cardFx(en){const l=[partFx(en.id,en.up)];if(en.id2)l.push(partFx(en.id2,en.up2));return l;}
function partCost(id,up){const base=STARS[id].cost;return up&&partFx(id,up)._costDown?Math.max(0,base-1):base;}
function costOf(en){return en.id2?Math.max(partCost(en.id,en.up),partCost(en.id2,en.up2)):partCost(en.id,en.up);}
function countAs(en){return en.id2?2:1;}
function canMergeWith(a,b){return !a.id2&&!b.id2&&STARS[a.id].con===STARS[b.id].con;}

function fxText(fx){
 const t=[];
 if(fx.cond&&fx.cond.t==='allAtkOnly')t.push('손패가 전부 공격 카드일 때만 낼 수 있습니다.');
 if(fx.dmg!=null){
  const p=fx.pierce?'관통 ':'';
  if((fx.hits||1)>1)t.push(`${p}피해를 <b>${fx.dmg}</b>씩 <b>${fx.hits}</b>번 줍니다.`);
  else t.push(`${p}피해를 <b>${fx.dmg}</b> 줍니다.`);
 }
 if(fx.dmgEqBlock)t.push('현재 성막만큼 피해를 줍니다.');

const R={hp:70,maxHp:70,deck:[],dust:0,allies:[],relics:[],items:[],map:null,pos:-1,usedEvents:[],wins:0};

function genMap(){
 const ROWS=12,nodes=[];
 for(let r=0;r<ROWS;r++){
  const cnt=r===ROWS-1?1:(r===0?3:rand(2,3));
  let cols=r===ROWS-1?[1]:shuffle([0,1,2]).slice(0,cnt).sort();
  for(const c of cols)nodes.push({i:nodes.length,r,c,type:'battle',edges:[],visited:false});
 }
 const rowNodes=r=>nodes.filter(n=>n.r===r);
 for(let r=0;r<ROWS-1;r++){
  const cur=rowNodes(r),nxt=rowNodes(r+1);
  for(const a of cur){
   const tg=r+1===ROWS-1?nxt:nxt.filter(b=>Math.abs(b.c-a.c)<=1);
   const pick=shuffle(tg.slice()).slice(0,Math.max(1,rand(1,2)));
   for(const b of pick)if(!a.edges.includes(b.i))a.edges.push(b.i);
  }
  for(const b of nxt){ /* 진입 보장 */
   if(!cur.some(a=>a.edges.includes(b.i))){
    const near=cur.filter(a=>Math.abs(a.c-b.c)<=1);
    const a=(near.length?near:cur)[0];a.edges.push(b.i);
   }
  }
 }
 /* 종류 배치 */
 const setOne=(r,type,excl)=>{
  const cand=rowNodes(r).filter(n=>n.type==='battle'&&!(excl||[]).includes(n.i));
  if(cand.length){const n=cand[rand(0,cand.length-1)];n.type=type;return n;}
  return null;
 };
 rowNodes(11)[0].type='boss';
 for(const n of rowNodes(4))n.type='elite';
 for(const n of rowNodes(8))n.type='elite';
 setOne(3,'shop');setOne(9,'shop');
 setOne(6,'rest');setOne(10,'rest');
 setOne(rand(2,3)===2?2:5,'forge')||setOne(2,'forge')||setOne(5,'forge');
 setOne(rand(6,7),'elite'); /* 선택 정예 → 2회 확정 + 최대 3회 */
 let ev=0;
 for(const r of shuffle([1,2,5,7,10,3,9])){if(ev>=4)break;if(setOne(r,'event'))ev++;}
 /* 적 배정 */
 const usedElite=[];
 for(const n of nodes){
  if(n.type==='battle')n.enemy=POOL[n.r<=3?'easy':'mid'][rand(0,2)];
  if(n.type==='elite'){
   const remain=POOL.elite.filter(e=>!usedElite.includes(e));
   n.enemy=(remain.length?remain:POOL.elite)[rand(0,(remain.length?remain:POOL.elite).length-1)];
   usedElite.push(n.enemy);
  }
  if(n.type==='boss')n.enemy='m42';
 }
 return nodes;
}

    turnCounts:{},doneTurn:{},risen:{},flags:{},crisisSaid:false,skyDots:{},
    atkPlayed:0,nonAtkPlayed:0,skillTurnUsed:false,skillBattleUsed:{},

 logs=[];$('skysvg').innerHTML='';

function startTurn(){
 S.mana=3;
 if(S.keepBlock)S.keepBlock=false;else S.block=0;
 S.counter=0;
 S.turnCounts={};S.doneTurn={};S.skillTurnUsed=false;S.atkPlayed=0;S.nonAtkPlayed=0;S.nextAtkTwice=false;S._consDone=0;
 for(const c in S.risen){const B=CONS[c].bonus;if(B.turnFx)applyFx(B.turnFx,`성좌 「${CONS[c].name}」`);}

 draw(5+extra);

/* ── 피해·효과 ── */
function afterEnemyHurt(){
 if(!E)return;
 if(E.rage&&!E._raged&&E.hp>0&&E.hp<=E.maxHp/2){E._raged=1;E.str+=E.rage;log(`전의 — ${E.name.split(' ')[0]} 공격 +${E.rage}!`);}
 if(E.phase2&&!E._p2&&E.hp>0&&E.hp<=E.maxHp/2){E._p2=1;E.str+=3;E.pattern=E.pattern2;E.pi=0;banner('격노!','장막이 붉게 물든다');log('M42가 격노한다!');}
}
function dealDmg(base,pierce){
 let n=base+S.str;
 if(S.weak)n=Math.floor(n*0.75);
 if(E.vuln)n=Math.floor(n*1.5);
 if(E.aegis>0)n=Math.max(0,n-E.aegis);
 if(!pierce&&E.block>0){const b=Math.min(E.block,n);E.block-=b;n-=b;}
 E.hp=Math.max(0,E.hp-n);
 float(n,'#ffd76a');
 afterEnemyHurt();
 return n;
}
function applyFx(fx,src,en){
 /* 피해 계열 */
 if(fx.dmg!=null){
  let base=fx.dmg;
  if(fx.rampSelf&&en)base+=en._ramp||0;
  if(fx.perAtkPlayed)base+=fx.perAtkPlayed*S.atkPlayed;
  const h=fx.hits||1;
  const swing=()=>{let tot=0;for(let i=0;i<h;i++)tot+=dealDmg(base,fx.pierce);return tot;};
  let tot=swing();
  let again=false;
  if(fx.againIfPoison&&E.poison>0)again=true;
  if(fx.pairCon&&en&&(S.turnCounts[STARS[en.id].con]||0)>=1)again=true;
  if(again&&E.hp>0){tot+=swing();log(`${src} — 한 번 더!`);}
  log(`${src} — 피해 ${tot}`);
  if(fx.rampSelf&&en)en._ramp=(en._ramp||0)+fx.rampSelf;
 }
 if(fx.dmgEqBlock){const d=dealDmg(S.block,false);log(`${src} — 성막의 무게! 피해 ${d}`);}
 if(fx.randDmg){const v=rand(fx.randDmg[0],fx.randDmg[1]);const d=dealDmg(v,fx.pierce);log(`${src} — 변광! 피해 ${d}`);
  if(fx.jackpot&&v>=fx.randDmg[1]-2){draw(1);log(`${src} — 대박! 카드 1장`);}}
 /* 방어·버프 계열 */
 if(fx.block)S.block+=fx.block;
 if(fx.randBlock){const v=rand(fx.randBlock[0],fx.randBlock[1]);S.block+=v;log(`${src} — 성막 ${v}`);}
 if(fx.doubleBlock){S.block*=2;log(`${src} — 성막 2배!`);}
 if(fx.counter)S.counter+=fx.counter;
 if(fx.keepBlock)S.keepBlock=true;
 if(fx.poison)E.poison+=fx.poison;
 if(fx.doublePoison){E.poison*=2;log(`${src} — 중독 ${E.poison}(2배)!`);}
 if(fx.vuln)E.vuln+=fx.vuln;
 if(fx.weak)E.weak+=fx.weak;
 if(fx.thorns)S.thorns+=fx.thorns;
 if(fx.str)S.str+=fx.str;
 /* 손패·자원 계열 */
 if(fx.handRedraw){const n=S.hand.length;for(const x of S.hand)x._sealed=false;S.discard.push(...S.hand);S.hand=[];draw(n);log(`${src} — 손패를 새로 폅니다`);}
 if(fx.draw)draw(fx.draw);
 if(fx.mana)S.mana+=fx.mana;
 if(fx.heal)R.hp=Math.min(R.maxHp,R.hp+fx.heal);
 if(fx.nextTurn){S.next.draw=(S.next.draw||0)+(fx.nextTurn.draw||0);S.next.block=(S.next.block||0)+(fx.nextTurn.block||0);S.next.mana=(S.next.mana||0)+(fx.nextTurn.mana||0);}
 if(fx.nextAtkTwice)S.nextAtkTwice=true;
 /* 조건부 추가 효과 */
 if(fx.cond&&fx.cond.fx){
  const c=fx.cond;let ok=false;
  if(c.t==='enemyBlock')ok=E.block>0;
  if(c.t==='enemyDebuff')ok=(E[c.k]||0)>0;
  if(c.t==='balanced'){
   const cur=en?STARS[en.id].type==='공격':false;
   ok=(S.atkPlayed+(cur?1:0))>0&&(S.nonAtkPlayed+(cur?0:1))>0;
  }
  if(ok){applyFx(c.fx,src,en);log(`${src} — 조건 발동!`);}
 }
}
function canPlay(en){
 if(en._sealed)return false;
 if(costOf(en)>S.mana)return false;
 for(const f of cardFx(en))if(f.cond&&f.cond.t==='allAtkOnly'&&!S.hand.every(x=>STARS[x.id].type==='공격'))return false;
 return true;
}
function playCard(i){
 if(over)return;
 const en=S.hand[i];if(en==null)return;
 if(!canPlay(en)){$('manaOrb').classList.remove('shake');void $('manaOrb').offsetWidth;$('manaOrb').classList.add('shake');return;}
 S.mana-=costOf(en);
 S.hand.splice(i,1);
 const isAtk=STARS[en.id].type==='공격';
 const fxl=cardFx(en);
 const vanish=fxl.some(f=>f.vanish);
 if(vanish)S.vanished.push(en);else S.discard.push(en);
 en._sealed=false;
 const src=stripTags(cardName(en.id))+(en.id2?'·'+stripTags(cardName(en.id2)):'');
 let times=1;
 if(isAtk&&S.nextAtkTwice){times=2;S.nextAtkTwice=false;log('폴룩스의 짝 — 2번 발동!');}
 for(let t=0;t<times;t++)for(const f of fxl)applyFx(f,src,en);
 if(isAtk)S.atkPlayed++;else S.nonAtkPlayed++;
 addSkyDot(STARS[en.id].con);
 S.turnCounts[STARS[en.id].con]=(S.turnCounts[STARS[en.id].con]||0)+countAs(en);
 checkCons(STARS[en.id].con);
 renderAll();
 if(E.hp<=0)win();
}
function checkCons(c){
 const C=CONS[c],B=C.bonus;
 if(S.turnCounts[c]<C.need||S.doneTurn[c])return;
 if(S.conSealed===c){log(`흐린 하늘 — ${C.name}가 봉인되어 완성되지 않는다`);return;}
 S.doneTurn[c]=true;
 S._consDone=(S._consDone||0)+1;
 if(S._consDone===1&&hasRelic('armillary')){S.mana+=1;log('혼천의 — 물질 1');}
 if(E.aegis>0){E.aegis=Math.max(0,E.aegis-2);log(`일곱 자매의 가호가 흔들린다! (남은 ${E.aegis})`);}
 if(B.mode==='passive'){
  if(S.risen[c])return;
  S.risen[c]=true;
  drawConLines(c);
  banner(`✦ ${C.name} 떠오름!`,`${C.idn} — ${B.label} (지속)`);
  if(B.onceFx)applyFx(B.onceFx,`성좌 「${C.name}」`);
  if(B.flag)S.flags[B.flag]=true;
  log(`성좌 「${C.name}」 떠오름 — ${B.label}`);
 }else{
  drawConLines(c);
  banner(`✦ ${C.name} 완성!`,`${C.idn} — ${stripTags(fxText(B.fx))}`);
  applyFx(B.fx,`성좌 「${C.name}」`);
 }
 allyBark('con');
 if(E.hp<=0){renderAll();win();}
}

/* ── 영능·소모품 ── */
function useSkill(key){
 if(over||S.skillTurnUsed)return;
 const sk=activeSkills().find(x=>x.key===key);if(!sk)return;
 const def=sk.def;
 if(def.per==='battle'&&S.skillBattleUsed[key])return;
 if(def.plus){
  const c=ptolemyTarget();
  if(!c){log('오늘은 더 이을 별자리가 없군.');return;}
  S.skillTurnUsed=true;S.skillBattleUsed[key]=true;
  S.turnCounts[c]=(S.turnCounts[c]||0)+def.plus;
  addSkyDot(c);
  log(`「${def.s}」 — ${CONS[c].name} +1성`);
  checkCons(c);
  if(def.after&&!over)def.after();
 }else{

function nightBonus(){return E&&E.nightAt?Math.max(0,(E._t+1)-E.nightAt+1):0;}

function enemyTurn(){
 E.block=E.autoBlock||0;
 if(E.autoBlock)log(`얼음 갑주 — 성막 ${E.autoBlock}`);
 if(E.poison>0){
  E.hp=Math.max(0,E.hp-E.poison);
  log(`중독 — 피해 ${E.poison}`);
  if(!S.flags.poisonKeep)E.poison--;
  afterEnemyHurt();
  if(E.hp<=0){renderAll();win();return;}
 }
 const act=E.pattern[E.pi];
 if(act.atk!=null){
  const h=act.hits||1;let tot=0,stolen=0;
  for(let i=0;i<h;i++){
   let n=act.atk+E.str+nightBonus();
   if(E.weak)n=Math.floor(n*0.75);
   const b=Math.min(S.block,n);S.block-=b;stolen+=b;const hit=n-b;
   R.hp=Math.max(0,R.hp-hit);tot+=hit;
   const ret=S.thorns+S.counter;
   if(ret>0){E.hp=Math.max(0,E.hp-ret);afterEnemyHurt();}
  }
  log(`${act.label||'공격'} — 피해 ${tot}${(S.thorns+S.counter)?` (반격 ${(S.thorns+S.counter)*h})`:''}`);
  if(E.blockSteal&&stolen>0){E.block+=Math.floor(stolen/2);log(`성막 흡수 — ${Math.floor(stolen/2)}`);}
  document.body.classList.remove('shake');void document.body.offsetWidth;
  if(tot>0)document.body.classList.add('shake');
  if(R.hp>0&&R.hp<=21&&!S.crisisSaid){S.crisisSaid=true;allyBark('crisis');}
 }
 if(act.blk){E.block+=act.blk;log(`${E.name.split(' ')[0]} — 성막 ${act.blk}`);}
 if(act.weakP){S.weak+=act.weakP;log(`약화 ${act.weakP} 부여받음`);}
 if(act.seal)S.sealNext=(S.sealNext||0)+act.seal;
 if(act.conSeal)S.conSealNext=true;
 if(act.pulsar){E.block+=S.block;log(`펄서 파동 — 내 성막 ${S.block}이 흡수됐다!`);S.block=0;}
 if(act.charge)log(`${act.charge}…`);
 E.pi=(E.pi+1)%E.pattern.length;
 E._t++;
 if(E.accel&&E._t%E.accel===0){E.str+=1;log(`가속 — ${E.name.split(' ')[0]} 공격 +1`);}
 if(E.weak)E.weak--;if(E.vuln)E.vuln--;
 if(E.hp<=0){renderAll();win();return;}
 if(R.hp<=0){lose();return;}
 renderAll();
}

function intentTxt(){
 const act=E.pattern[E.pi];const parts=[];
 if(act.atk!=null){
  let n=act.atk+E.str+nightBonus();if(E.weak)n=Math.floor(n*0.75);
  parts.push(`⚔ 공격 ${n}${(act.hits||1)>1?`×${act.hits}`:''}`);
 }
 if(act.blk)parts.push(`🛡 성막 ${act.blk}`);
 if(act.weakP)parts.push(`☁ 약화 ${act.weakP}`);
 if(act.seal)parts.push(`⛓ 손패 봉인`);
 if(act.conSeal)parts.push(`🌫 별자리 봉인`);
 if(act.pulsar)parts.push(`🌀 성막 흡수`);
 if(act.charge)parts.push(`⚡ ${act.charge}`);
 const nb=nightBonus();
 let tail='';
 if(nb>0)tail=` · 🌙 깊은 밤 +${nb}`;
 else if(E.nightAt&&(E._t+1)>=E.nightAt-2)tail=' · 🌙 깊은 밤 임박';
 return '다음 의도: '+parts.join(' + ')+tail;
}

  <div class="optRow">${R.deck.map((en,i)=>{
   const ok=!en.id2&&!en.up;
   return cardHTML(en,{cls:ok?' pick':'',attr:ok?`onclick="doUpgrade(${i})"`:'style="opacity:.3"'});
  }).join('')}</div>
  <button class="btn ghost" onclick="window[upgReturn]()">${can.length?'그만두기':'돌아가기'}</button>`;
 $('rewardOvl').classList.add('show');
}
window.doUpgrade=function(i){
 const en=R.deck[i];
 if(!en||en.id2||en.up)return;
 en.up=1;upgRemain--;
 if(upgRemain>0)renderUpgrade();else window[upgReturn]();
};

/* ═══════════ 대장간 (쌍성 합성) ═══════════ */
let forgeFirst=null;
function showForge(){forgeFirst=null;renderForge();$('rewardOvl').classList.add('show');}
function renderForge(){
 $('rewardPanel').innerHTML=`<h2>⚒ 대장간 — 두 별을 하나로</h2>
  <p>같은 별자리 별 2장을 골라 <b>쌍성</b>으로 벼립니다. 비용은 높은 쪽, 효과는 둘 다, 성좌 <b>2성</b>으로 계산합니다. (방문당 1회)</p>
  <div class="optRow">${R.deck.map((en,i)=>{
   const isFirst=forgeFirst===i;
   const ok=!en.id2&&(forgeFirst===null?true:(i!==forgeFirst&&canMergeWith(R.deck[forgeFirst],en)));
   return cardHTML(en,{cls:(ok?' pick':'')+(isFirst?' picked':''),attr:ok?`onclick="forgePick(${i})"`:'style="opacity:.3"'});
  }).join('')}</div>
  <button class="btn ghost" onclick="backToMap()">떠나기</button>`;
}
window.forgePick=function(i){
 if(forgeFirst===null){forgeFirst=i;renderForge();return;}
 if(i===forgeFirst){forgeFirst=null;renderForge();return;}
 const a=R.deck[forgeFirst],b=R.deck[i];
 if(!canMergeWith(a,b))return;
 const merged={id:a.id,up:a.up,id2:b.id,up2:b.up};
 $('rewardPanel').innerHTML=`<h2>⚒ 쌍성 미리보기</h2>
  <div class="optRow">${cardHTML(merged)}</div>
  <button class="btn" onclick="forgeConfirm(${forgeFirst},${i})">벼린다</button>
  <button class="btn ghost" onclick="forgeFirst=null;renderForge()">다시 고르기</button>`;
};
window.forgeConfirm=function(ai,bi){
 const a=R.deck[ai],b=R.deck[bi];
 const merged={id:a.id,up:a.up,id2:b.id,up2:b.up};
 R.deck=R.deck.filter((_,x)=>x!==ai&&x!==bi);
 R.deck.push(merged);
 backToMap();
};

/* ═══════════ 이벤트 (하이리스크 하이리턴) ═══════════ */
const EVENTS=[
 {id:'supernova',n:'초신성 관측',d:'죽어 가는 별이 마지막으로 타오른다. 가까이서 기록하면 으뜸별의 정수를 얻겠지만, 폭풍이 몸을 태울 것이다.',
  risk:{t:'HP 12를 잃고 α급 별 1장을 담는다',run(){R.hp-=12;const a=Object.keys(STARS).filter(id=>STARS[id].rank===1);R.deck.push({id:a[rand(0,a.length-1)]});}},
  safe:{t:'멀리서 바라만 본다',run(){}}},
 {id:'blackhole',n:'블랙홀의 가장자리',d:'사건의 지평선 근처에 오래된 관측 기구가 떠 있다. 손을 뻗으면 덱의 별 두 개가 빨려 들어갈 것이다.',
  can:()=>R.deck.length>=7,
  risk:{t:'무작위 2장을 잃고 유물을 얻는다',run(){for(let i=0;i<2;i++)R.deck.splice(rand(0,R.deck.length-1),1);giveRandomRelic();}},
  safe:{t:'지나간다',run(){}}},
 {id:'meteorshow',n:'유성우 속으로',d:'별똥별이 쏟아진다. 한가운데로 뛰어들면 더 많이 주울 수 있다.',
  risk:{t:'HP 8을 잃고 소모품 2개',run(){R.hp-=8;addItem();addItem();}},
  safe:{t:'가장자리에서 1개만 줍는다',run(){addItem();}}},
 {id:'wish',n:'별똥별의 소원',d:'소원을 빌면 가루가 두 배가 된다고 한다. 물론 절반의 밤에는 아무것도 남지 않았다고도 한다.',
  can:()=>R.dust>0,
  risk:{t:'별빛 가루 전부를 건다 (50% 두 배 / 50% 소멸)',run(){if(Math.random()<0.5){R.dust*=2;}else R.dust=0;}},
  safe:{t:'빌지 않는다',run(){}}},
 {id:'observatory',n:'낡은 관측소',d:'버려진 관측소. 무너진 천장 아래 무언가 반짝인다. 잔해를 파헤치면 다칠 것이다.',
  risk:{t:'HP 10을 잃고 유물을 얻는다',run(){R.hp-=10;giveRandomRelic();}},
  safe:{t:'지나간다',run(){}}},
 {id:'darknebula',n:'어두운 성운',d:'빛을 삼키는 성운. 별 하나를 제물로 바치면 남은 별들이 더 밝게 벼려진다.',
  can:()=>R.deck.length>=6&&R.deck.some(en=>!en.id2&&!en.up),
  risk:{t:'무작위 1장을 잃고 카드 2장을 강화한다',run(){R.deck.splice(rand(0,R.deck.length-1),1);openUpgrade('backToMap',2);return true;}},
  safe:{t:'지나간다',run(){}}},
 {id:'timedilation',n:'시간 지연',d:'강한 중력 우물 곁을 지나면 지름길이 열린다 — 대신 몸의 시간이 뒤틀린다.',
  risk:{t:'최대 HP −5, 별빛 가루 80',run(){R.maxHp-=5;R.hp=Math.min(R.hp,R.maxHp);R.dust+=80;}},
  safe:{t:'돌아서 간다',run(){}}},
 {id:'binarydance',n:'쌍성의 춤',d:'두 별이 서로를 도는 춤. 끼어들면 내 덱의 같은 별자리 한 쌍이 하나로 묶인다 — 어느 쌍일지는 하늘이 정한다.',
  can:()=>{const g={};for(const en of R.deck)if(!en.id2){const c=STARS[en.id].con;(g[c]=g[c]||[]).push(en);}return Object.values(g).some(a=>a.length>=2);},
  risk:{t:'무작위 한 쌍이 즉시 쌍성으로 합성된다',run(){
   const g={};R.deck.forEach((en,i)=>{if(!en.id2){const c=STARS[en.id].con;(g[c]=g[c]||[]).push(i);}});
   const pairs=Object.values(g).filter(a=>a.length>=2);
   const pair=pairs[rand(0,pairs.length-1)];
   const ai=pair[0],bi=pair[1],a=R.deck[ai],b=R.deck[bi];
   const merged={id:a.id,up:a.up,id2:b.id,up2:b.up};
   R.deck=R.deck.filter((_,x)=>x!==ai&&x!==bi);R.deck.push(merged);
  }},
  safe:{t:'춤을 방해하지 않는다',run(){}}},
];
function giveRandomRelic(){
 const un=Object.keys(RELICS).filter(k=>!hasRelic(k));
 if(un.length)R.relics.push(un[rand(0,un.length-1)]);else R.dust+=40;
}
function addItem(){
 if(R.items.length>=3)return;
 const ks=Object.keys(ITEMS);R.items.push(ks[rand(0,ks.length-1)]);
}
function showEvent(){
 const cand=EVENTS.filter(e=>!R.usedEvents.includes(e.id)&&(!e.can||e.can()));
 if(!cand.length){R.dust+=20;showMap();return;}
 const ev=cand[rand(0,cand.length-1)];
 R.usedEvents.push(ev.id);
 $('rewardPanel').innerHTML=`<h2>? ${ev.n}</h2>
  <p style="max-width:520px;margin:0 auto 16px">${ev.d}</p>
  <button class="btn" onclick="evChoose('${ev.id}',true)">${ev.risk.t}</button><br>
  <button class="btn ghost" onclick="evChoose('${ev.id}',false)">${ev.safe.t}</button>`;
 $('rewardOvl').classList.add('show');
}
window.evChoose=function(id,risky){
 const ev=EVENTS.find(e=>e.id===id);
 const stay=(risky?ev.risk:ev.safe).run();
 if(R.hp<=0){lose('가혹한 우주');return;}
 if(!stay)backToMap();
};

/* ═══════════ 종료 ═══════════ */
function clearRun(){
 $('endPanel').innerHTML=`<h2>🌌 여정 완주!</h2>
  <p>오리온 대성운을 잠재웠습니다. 덱 ${R.deck.length}장 · HP ${R.hp}/${R.maxHp} · 가루 ${R.dust} · 승리 ${R.wins}회<br>
  조력자 ${R.allies.map(k=>ALLIES[k].n).join('·')||'없음'} · 유물 ${R.relics.map(k=>RELICS[k].n).join('·')||'없음'}</p>
  <p style="font-size:12px">${R.deck.map(en=>stripTags(cardName(en.id))+(en.up?'+':'')+(en.id2?'(쌍성)':'')).join(' · ')}</p>
  <button class="btn" onclick="location.reload()">새 여정</button>`;
 $('endOvl').classList.add('show');
}
function lose(cause){
 over=true;
 $('endPanel').innerHTML=`<h2>별이 지다…</h2>
  <p>${cause||(E?E.name:'우주')}에게 쓰러졌습니다. (승리 ${R.wins}회)</p>
  <button class="btn" onclick="location.reload()">다시 도전</button>`;
 $('endOvl').classList.add('show');
}

/* ═══════════ 런 시작 ═══════════ */
function startRun(){
 R.hp=70;R.maxHp=70;R.dust=0;R.allies=[];R.relics=[];R.items=[];R.usedEvents=[];R.pos=-1;R.wins=0;
 R.deck=['caph','caph','tsih','phecda','phecda','megrez','castor','castor','saiph','saiph']
   .map(id=>({id,basic:true}));
 R.map=genMap();
 showAllyPick(true,()=>{$('rewardOvl').classList.remove('show');showMap();});
}

document.addEventListener('keydown',e=>{
 if($('rewardOvl').classList.contains('show')||$('endOvl').classList.contains('show'))return;
 if(!S||$('app').style.display==='none')return;
 if(e.code==='Space'||e.key==='e'||e.key==='E'){e.preventDefault();endTurn();}
 const n=parseInt(e.key);
 if(n>=1&&n<=9)playCard(n-1);
});

startRun();
</script>
</body>
</html>

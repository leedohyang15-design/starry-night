function bres(a, b) {
  let [x0, y0] = a, [x1, y1] = b;
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, out = [];
  for (;;) {
    out.push([x0, y0]);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx) { err += dx; y0 += sy; }
  }
  return out;
}

function px(c, r, fill, key, size, opacity) {
  const s = size || CELL, pad = (CELL - s) / 2;
  return React.createElement("rect", {
    key, x: c * CELL + pad, y: r * CELL + pad, width: s, height: s, fill, opacity,
  });
}

function project(stars) {
  let ras = stars.map(s => s[0]);
  if (Math.max(...ras) - Math.min(...ras) > 12) ras = ras.map(v => (v < 12 ? v + 24 : v));
  const decs = stars.map(s => s[1]);
  const decMid = (Math.max(...decs) + Math.min(...decs)) / 2;
  const raMid = (Math.max(...ras) + Math.min(...ras)) / 2;
  const rad = Math.PI / 180;
  const d0 = decMid * rad, a0 = raMid * 15 * rad;
  const pts = stars.map((s, i) => {
    const d = s[1] * rad, da = ras[i] * 15 * rad - a0;
    const cosc = Math.sin(d0) * Math.sin(d) + Math.cos(d0) * Math.cos(d) * Math.cos(da);
    const k = 2 / (1 + cosc);
    return [
      -k * Math.cos(d) * Math.sin(da) * 57.3,
      -k * (Math.cos(d0) * Math.sin(d) - Math.sin(d0) * Math.cos(d) * Math.cos(da)) * 57.3,
    ];
  });
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const spanX = Math.max(...xs) - Math.min(...xs) || 1;
  const spanY = Math.max(...ys) - Math.min(...ys) || 1;
  const scale = Math.min((COLS - 2 * PAD) / spanX, (ROWS - 2 * PAD) / spanY);
  const offX = (COLS - spanX * scale) / 2 - Math.min(...xs) * scale;
  const offY = (ROWS - spanY * scale) / 2 - Math.min(...ys) * scale;
  return pts.map(p => [Math.round(p[0] * scale + offX), Math.round(p[1] * scale + offY)]);
}

class Component extends DCLogic {
  sprite(c, r, mag, i, sparkle) {
    const out = [];
    if (!sparkle || mag > 3.4) {
      out.push(px(c, r, mag > 4 ? HALO : ARM, "f" + i, mag > 4 ? 3 : 4, mag > 4 ? 0.8 : 0.95));
      return out;
    }
    const reach = mag < 2 ? 3 : 2;
    out.push(px(c, r, CORE, "c" + i, 4));
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx, dy], d) => {
      for (let k = 1; k <= reach; k++) {
        out.push(px(c + dx * k, r + dy * k, k === 1 ? ARM : HALO, "a" + i + d + k,
          k === 1 ? 4 : k === 2 ? 3 : 2, k >= 2 ? 0.7 : 1));
      }
    });
    if (mag < 2) [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([dx, dy], d) =>
      out.push(px(c + dx, r + dy, HALO, "g" + i + d, 2, 0.55)));
    return out;
  }

  chart(entry, ci, sparkle) {
    const pts = project(entry.s);
    const seen = new Set(), lines = [];
    entry.l.forEach((seg, i) => {
      const a = pts[seg[0]], b = pts[seg[1]];
      if (!a || !b) return;
      bres(a, b).forEach(([c, r], j) => {
        const k = c + ":" + r;
        if (seen.has(k)) return;
        seen.add(k);
        lines.push(px(c, r, i % 2 ? LINE : LINE, "l" + i + "-" + j, 2, 0.75));
      });
    });
    const sky = [];
    let seed = 7919 * (ci + 3);
    const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
    for (let i = 0; i < 46; i++) {
      const c = Math.floor(rnd() * COLS), r = Math.floor(rnd() * ROWS);
      if (pts.some(p => Math.abs(p[0] - c) < 5 && Math.abs(p[1] - r) < 5)) continue;
      const d = rnd();
      sky.push(px(c, r, d > 0.8 ? ARM : "#6f6544", "k" + i, 2, 0.2 + d * 0.4));
    }
    const stars = [];
    pts.forEach((p, i) => stars.push(...this.sprite(p[0], p[1], entry.s[i][2], i, sparkle)));
    return React.createElement("svg", {
      viewBox: "0 0 " + COLS * CELL + " " + ROWS * CELL,
      style: { width: "100%", height: "auto", display: "block", shapeRendering: "crispEdges", background: "#05060c" },
    }, [
      React.createElement("g", { key: "sky" }, sky),
      React.createElement("g", { key: "ln" }, lines),
      React.createElement("g", { key: "st" }, stars),
    ]);
  }

  renderVals() {
    const sparkle = (this.props.starStyle ?? "반짝임") === "반짝임";
    const showAbbr = this.props.latinCode ?? true;
    return {
      charts: DATA.map((e, i) => ({
        ko: e.ko,
        abbr: showAbbr ? e.abbr : "",
        svg: this.chart(e, i, sparkle),
      })),
    };
  }
}
</script>
</body>
</html>
